# Gated deploys of the control plane (docs/upgrading.md, "Deploying with deploy.yml"). By hand, on a release tag, or on
# a merge to main while the infra is up:
#   1. images.yml builds every environment image and harness pack tag the commit needs, and this builds and pushes
#      the control-plane image;
#   2. after the owner approves the `production` environment: kubectl set image, wait for the rollout;
#   3. scripts/acceptance/gke.sh against the new server over its REST and MCP endpoints (no kubectl in the checks):
#      the core checks, which roll back when they fail, then the team checks, which are only reported;
#   4. the run summary gets the MCP tool-list diff, the new server version and the acceptance results, and hangar
#      records the deploy (`hangar doctor`, `hangar power`).
# Any failure once the image has changed, a cancel or a timeout included, puts the image it replaced back and fails
# the run. A doctor check that already failed before the deploy is reported, not rolled back for.
#
# It refuses to deploy while the sandbox pools are powered down (the checks need sandboxes) unless `force` is set; a
# forced deploy then runs only the checks that need no sandbox.
#
# --- infra-state: a merge to main deploys too, only while the infra is up (docs/cicd.md, "Infra states"). The `state`
# job reads the cluster's power labels (`power.sh state`) as GCP_STATE_SERVICE_ACCOUNT, which can read the cluster's
# metadata and nothing else. While it is off, held or down, the run skips green and builds nothing: the next
# `power.sh up` starts deploy.yml for main when main is ahead of what hangar runs. Up, it builds and waits for the
# owner's approval like any deploy. Merges in a burst coalesce: the concurrency group keeps one run going and only the
# newest waiting (GitHub cancels a waiting run when a newer one queues), and a run that a newer push to main has
# overtaken skips, before its builds and again after the approval.
#
# deploy/gke/setup-cicd.sh sets up everything below, once, from the owner's machine (docs/cicd.md).
# Repository secrets, shared with images.yml (docs/gke.md): GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
# HANGAR_REGISTRY; and for the state check GCP_STATE_SERVICE_ACCOUNT and HANGAR_CLUSTER
# (projects/<project>/locations/<zone>/clusters/<name>): names, not credentials. Without the first three (before
# setup, or on a fork) it skips with a notice and stays green; without the last two a merge doesn't deploy. It runs only from
# main or a v* tag: the production environment deploys nothing else, and Google Cloud trusts nothing else.
# `production` environment secrets, released only once the required reviewer approves (as repository secrets any
# workflow on any branch could read them, and the approval would gate nothing):
#   GCP_DEPLOY_SERVICE_ACCOUNT   the deploy identity, impersonable only from the production environment
#                                (docs/upgrading.md); there is no fallback to GCP_SERVICE_ACCOUNT
#   GKE_CLUSTER, GKE_LOCATION    the cluster's name and zone
#   HANGAR_URL                   https://<your hangar>
#   HANGAR_DEPLOY_TOKEN          an admin token: the acceptance checks and the deploy record
name: deploy
on:
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even while the sandbox pools are powered down (then only checks that need no sandbox run)
        type: boolean
        default: false
  push:
    branches: [main]  # --- infra-state: only while the infra is up (the state job)
    tags: ["v*"]

# One deploy at a time, never cancelled half way. GitHub keeps at most one more run waiting in the group and cancels
# it when a newer one queues, so a burst of merges deploys the run already going and the newest.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HANGAR_REGISTRY: ${{ secrets.HANGAR_REGISTRY }}
    steps:
      - name: Check setup
        id: check
        run: |
          missing=()
          for v in WIF_PROVIDER WIF_SERVICE_ACCOUNT HANGAR_REGISTRY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=deploy: skipped::Missing secrets: ${missing[*]} (WIF_* are GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT). deploy/gke/setup-cicd.sh sets them (docs/cicd.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # --- cicd: refused here, before building anything, rather than at the environment's gate
            echo "::error title=deploy: refused::Deploys run from main or a v* tag (the production environment's policy, and the only refs Google Cloud trusts); this run is on $GITHUB_REF."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # --- infra-state: is the infra up? Only the cluster's labels are read, as an account that can read the cluster's
  # metadata and nothing else (container.clusters.get; deploy/gke/setup-cicd.sh). No hangar token, no kubectl.
  state:
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # and main's head: a merge it has moved past doesn't deploy
      id-token: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      infra: ${{ steps.decide.outputs.infra }}
    env:
      STATE_SA: ${{ secrets.GCP_STATE_SERVICE_ACCOUNT }}
      HANGAR_CLUSTER: ${{ secrets.HANGAR_CLUSTER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: deploy/gke/power.sh
          sparse-checkout-cone-mode: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        id: auth
        if: env.STATE_SA != '' && env.HANGAR_CLUSTER != ''
        continue-on-error: true  # unread, a merge skips (with a warning) rather than failing
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STATE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        if: steps.auth.outcome == 'success'
      - name: Decide (a merge deploys only while the infra is up)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SIGNED_IN: ${{ steps.auth.outcome == 'success' }}
        run: |
          short=${GITHUB_SHA:0:12}
          state=unknown
          if [ "$SIGNED_IN" = true ]; then
            IFS=/ read -r _ PROJECT _ ZONE _ CLUSTER <<<"$HANGAR_CLUSTER"
            export PROJECT ZONE CLUSTER
            if out=$(bash deploy/gke/power.sh state); then
              state=$(jq -r '.summary // "unknown"' <<<"$out")
              echo "infra: $out"
            fi
          fi
          echo "infra=$state" >> "$GITHUB_OUTPUT"
          deploy=true
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || head=""
            if [ -z "$head" ]; then
              echo "::warning title=deploy: skipped::Couldn't read main's head, so $short isn't deployed (it may be an old commit). Run deploy.yml by hand to deploy main."
              deploy=false
            elif [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice title=deploy: superseded::main has moved on to ${head:0:12}; the run for that merge deploys instead of $short."
              deploy=false
            elif [ "$state" = unknown ]; then
              echo "::warning title=deploy: skipped::Couldn't read the infra state (GCP_STATE_SERVICE_ACCOUNT and HANGAR_CLUSTER; deploy/gke/setup-cicd.sh sets them up), so $short isn't deployed. Run deploy.yml by hand to deploy it."
              deploy=false
            elif [ "$state" != up ]; then
              echo "::notice title=deploy: skipped::infra is $state; not deploying $short; it will deploy on the next power-up (power.sh up starts deploy.yml; after a scheduled one, hangar power shows the command)"
              deploy=false
            fi
          elif [ "$state" = off ]; then
            echo "::error title=deploy: refused::hangar is off (power.sh off). Bring it back with bash deploy/gke/power.sh up, which then deploys main if it is ahead."
            exit 1
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Infra: **$state**. Deploying $short: **$deploy**." >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: [setup, state]
    if: needs.state.outputs.deploy == 'true'
    uses: ./.github/workflows/images.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  control-plane:
    needs: [setup, state]
    if: needs.state.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    # Only the digest crosses jobs: GitHub drops a job output that contains a secret's value ("Skip output 'image'
    # since it may contain secret"), and the registry path is the HANGAR_REGISTRY secret. The deploy job rebuilds the
    # full reference from the secret, the commit and this digest.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      HANGAR_REGISTRY: ${{ secrets.HANGAR_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Registry host
        id: reg
        run: echo "host=${HANGAR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.HANGAR_REGISTRY }}/control-plane:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: |
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build returned no image digest"; exit 1; }
          echo "built control-plane:$GITHUB_SHA@$digest"

  deploy:
    needs: [setup, state, images, control-plane]
    if: needs.state.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # --- acceptance: the core checks' 75 and the team checks' 60, with the rollout and a rollback
    environment: production  # the owner approves here (a required reviewer); its secrets exist only past this
    permissions:
      contents: read
      id-token: write
    env:
      HANGAR_URL: ${{ secrets.HANGAR_URL }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_DEPLOY_TOKEN }}
      HANGAR_REGISTRY: ${{ secrets.HANGAR_REGISTRY }}
      IMAGE: ${{ secrets.HANGAR_REGISTRY }}/control-plane:${{ github.sha }}@${{ needs.control-plane.outputs.digest }}
      INFRA: ${{ needs.state.outputs.infra }}  # the cluster's power labels, read by the state job
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      NS: hangar
    steps:
      - name: Check the production environment's secrets
        env:
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
          GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
        run: |
          missing=()
          for v in DEPLOY_SA GKE_CLUSTER GKE_LOCATION HANGAR_URL HANGAR_TOKEN; do [ -n "${!v}" ] || missing+=("$v"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=deploy: not set up::The production environment lacks: ${missing[*]} (DEPLOY_SA is GCP_DEPLOY_SERVICE_ACCOUNT, HANGAR_TOKEN is HANGAR_DEPLOY_TOKEN). They are environment secrets, not repository ones: docs/upgrading.md, \"Deploying with deploy.yml\"."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Project (from the registry, <region>-docker.pkg.dev/<project>/hangar)
        id: project
        run: echo "id=$(cut -d/ -f2 <<<"$HANGAR_REGISTRY")" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395  # v3.0.0
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ steps.project.outputs.id }}
      - name: Before (power state, the server's tools, the running image)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked
          # --- infra-state: a merge waited here for approval. One main has moved past deploys no more (the newer
          # merge's run does, a re-run of an old one included), and one that finds the pools down or held, or
          # hangar not answering (off since), skips green: the next power-up deploys main.
          merge=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then merge=true; fi
          skip() { echo "::notice title=deploy: skipped::$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$merge" = true ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || head=""
            if [ -z "$head" ]; then skip "Couldn't read main's head; run deploy.yml by hand to deploy main."; fi
            if [ "$head" != "$GITHUB_SHA" ]; then
              skip "main has moved on to ${head:0:12}; the run for that merge deploys instead of ${GITHUB_SHA:0:12}."
            fi
          fi
          api() { curl -fsS --max-time 30 -H "Authorization: Bearer $HANGAR_TOKEN" "$@"; }
          view=$(api "$HANGAR_URL/api/admin/power") || view='{}'
          power=$(jq -r '.power.state // "unknown"' <<<"$view" 2>/dev/null) || power=unknown
          if [ "$power" = unknown ] && [ -n "$INFRA" ] && [ "$INFRA" != unknown ]; then
            # a server too old to report its power (or one that is down) can't block its own upgrade: the state
            # job already read the cluster's labels
            echo "::notice::hangar didn't report its power state; using the cluster's labels: $INFRA"
            power=$INFRA
          fi
          held=$(jq -r '.power.hold.when // empty' <<<"$view" 2>/dev/null) || held=""
          echo "power=$power" >> "$GITHUB_OUTPUT"
          echo "sandbox pools: $power${held:+ (held until $held)}"
          if [ "$merge" = true ] && { [ "$power" != up ] || [ -n "$held" ]; }; then
            skip "infra is ${held:+held, }$power; not deploying ${GITHUB_SHA:0:12}; it will deploy on the next power-up (a fix for a hangar that doesn't answer: run deploy.yml by hand)"
          fi
          if [ "$power" = down ] || [ "$power" = starting ]; then
            if [ "$FORCE" != true ]; then
              echo "::error title=deploy: refused::The sandbox pools are $power, so the acceptance checks can't run. Deploy after they power on, or run again with force (only the checks that need no sandbox run)."
              exit 1
            fi
            echo "only=--only doctor,power,metrics" >> "$GITHUB_OUTPUT"
            echo "::warning::Forced while the sandbox pools are $power: only the checks that need no sandbox run."
          fi
          uv run --locked python scripts/acceptance/hangar_accept.py tools > before.json || echo '{}' > before.json
          # what the doctor already fails on: the acceptance reports it, and doesn't roll back for it
          uv run --locked python scripts/acceptance/hangar_accept.py doctor-failing > doctor-before.json ||
            echo '[]' > doctor-before.json
          echo "doctor failing before the deploy: $(cat doctor-before.json)"
          prev=$(kubectl -n "$NS" get deploy hangar -o jsonpath='{.spec.template.spec.containers[?(@.name=="hangar")].image}')
          [ -n "$prev" ] || { echo "::error::can't read the running image, so there would be nothing to roll back to"; exit 1; }
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [[ ! "$IMAGE" =~ /control-plane:[0-9a-f]{40}@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no usable image reference to deploy (control-plane job's digest missing); refusing before touching the cluster"
            exit 1
          fi
          echo "running $prev; deploying $IMAGE"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Drain (creates and destroys in flight finish before hangar restarts)
        id: drain
        if: steps.pre.outputs.go == 'true'
        run: |
          api() { curl -fsS --max-time 30 -H "Authorization: Bearer $HANGAR_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X POST -d '{"minutes": 30}' "$HANGAR_URL/api/admin/drain" > /dev/null || { echo "no drain (hangar unreachable)"; exit 0; }
          echo "began=true" >> "$GITHUB_OUTPUT"
          for _ in $(seq 60); do
            [ "$(api "$HANGAR_URL/api/admin/drain" | jq -r .settled)" = true ] && { echo "settled"; exit 0; }
            sleep 5
          done
          echo "not settled after 5 min; the reconciler finishes what a restart catches half way"
      - name: Roll out
        id: rollout
        if: steps.pre.outputs.go == 'true'
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"
          kubectl -n "$NS" set image deploy/hangar hangar="$IMAGE"
          kubectl -n "$NS" rollout status deploy/hangar --timeout=15m
          for _ in $(seq 60); do curl -fsS --max-time 10 "$HANGAR_URL/healthz" > /dev/null && exit 0; sleep 5; done
          echo "::error::$HANGAR_URL/healthz didn't answer within 5 min of the rollout"; exit 1
      - name: Acceptance
        if: steps.pre.outputs.go == 'true'
        timeout-minutes: 75  # a step timeout fails the step (and rolls back); the job's would cancel it
        env:
          ONLY: ${{ steps.pre.outputs.only }}
        run: |
          # --- acceptance: the core checks (CORE in gke.sh) alone decide this step, and so the rollback. The team
          # checks run in the next step, which can't fail the job: neither a failing nor a slow one rolls back.
          # shellcheck disable=SC2086 # ONLY is empty or "--only a,b,c" (forced: it narrows the core checks)
          bash scripts/acceptance/gke.sh --no-kubectl --only core --record accept.jsonl \
            --report accept-report.json --gate core --doctor-baseline doctor-before.json $ONLY
      # --- acceptance: the team checks (docs/acceptance.md), reported in the summary and the deploy record. Each
      # check without its fixture skips and says so; repos are variables, tokens secrets, of the production
      # environment. No model turns (they cost money) and no power cycle: those run by hand. continue-on-error keeps
      # its failure, or its timeout, from failing the job; `timeout` stops it first, so its cleanup still runs.
      - name: Acceptance, reported (the team checks; never rolls back)
        id: team
        if: success() && steps.pre.outputs.go == 'true' && steps.pre.outputs.only == ''
        continue-on-error: true
        timeout-minutes: 60
        env:
          HANGAR_ACCEPT_TEST_REPO: ${{ vars.HANGAR_ACCEPT_TEST_REPO }}
          HANGAR_ACCEPT_FIXTURE_REPO: ${{ vars.HANGAR_ACCEPT_FIXTURE_REPO }}
          HANGAR_ACCEPT_GITHUB_TOKEN: ${{ secrets.HANGAR_ACCEPT_GITHUB_TOKEN }}
          HANGAR_ACCEPT_JIRA_WEBHOOK_SECRET: ${{ secrets.HANGAR_ACCEPT_JIRA_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.HANGAR_ACCEPT_GITHUB_TOKEN }}  # cleanup deletes test branches with gh
        run: |
          timeout --signal=INT --kill-after=8m 50m bash scripts/acceptance/gke.sh --no-kubectl \
            --skip core,model,steer,gateway --record accept.jsonl --report accept-team-report.json
      - name: Summary (version, tool-list diff, acceptance)
        if: always() && steps.rollout.outputs.changed == 'true'
        run: |
          uv run --locked python scripts/acceptance/hangar_accept.py tools > after.json || echo '{}' > after.json
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          def load(path):
              try:
                  return json.load(open(path))
              except (OSError, ValueError):
                  return {}
          before, after = load("before.json"), load("after.json")
          print(f"## Deploy `{os.environ['IMAGE'].split('@')[0].rsplit('/', 1)[-1]}`\n")
          print(f"Server version: `{before.get('version', 'unreachable')}` → `{after.get('version', 'unreachable')}`\n")
          old, new = set(before.get("tools", [])), set(after.get("tools", []))
          if before and after:
              added, removed = sorted(new - old), sorted(old - new)
              print(f"MCP tools: {len(old)} → {len(new)}" + ("" if added or removed else ", no change"))
              for t in added:
                  print(f"- added `{t}`")
              for t in removed:
                  print(f"- removed `{t}`")
              if added or removed:
                  print("\nclaude.ai keeps its tool list until the connector is removed and added again.")
          try:
              rows = [json.loads(line) for line in open("accept.jsonl")]
          except OSError:
              rows = []
          core = set(load("accept-report.json").get("core") or [])  # --- acceptance: what the rollback counts
          print("\n| check | result | core | time | summary |\n|---|---|---|---|---|")
          for r in rows:
              print(f"| {r['check']} | {r['status']} | {'yes' if r['check'] in core else ''} | {r['seconds']} s | "
                    f"{r['summary'].replace('|', '/')[:300]} |")
          for r in rows:
              if r["check"] == "warmstart" and r.get("data"):
                  runs = ", ".join(f"{c['path']} {c['seconds']} s" for c in r["data"]["creates"])
                  print(f"\nCreate latency on `{r['data']['environment']}`: {runs}")
          PY
      # The kubeconfig's token lasts an hour, which a long acceptance run can outlast: a fresh one for the rollback.
      # A cancelled run (by hand, or the job's timeout) rolls back too.
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395  # v3.0.0
        if: (failure() || cancelled()) && steps.rollout.outputs.changed == 'true'
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ steps.project.outputs.id }}
      # The image it replaced, not `rollout undo`: undo goes back one revision, which is the version *before* the
      # running one when `set image` failed or redeployed the running image (no new revision).
      - name: Roll back
        id: rollback
        if: (failure() || cancelled()) && steps.rollout.outputs.changed == 'true'
        env:
          PREVIOUS: ${{ steps.pre.outputs.previous }}
        run: |
          echo "::error::Rolling back to $PREVIOUS"
          kubectl -n "$NS" set image deploy/hangar hangar="$PREVIOUS"
          kubectl -n "$NS" rollout status deploy/hangar --timeout=15m
          for _ in $(seq 60); do curl -fsS --max-time 10 "$HANGAR_URL/healthz" > /dev/null && break; sleep 5; done
          echo "## Rolled back to \`$PREVIOUS\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the deploy in hangar
        if: always() && steps.rollout.outputs.changed == 'true'
        env:
          RESULT: ${{ steps.rollback.outcome == 'success' && 'rolled_back' || job.status == 'success' && 'passed' || 'failed' }}
          PREVIOUS: ${{ steps.pre.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(python3 - <<'PY'
          import json, os
          try:
              rows = [json.loads(line) for line in open("accept.jsonl")]
          except OSError:
              rows = []
          try:
              version = json.load(open("after.json")).get("version")
          except (OSError, ValueError):
              version = None
          failed = [r["check"] for r in rows if r["status"] == "fail"]
          print(json.dumps({"result": os.environ["RESULT"], "image": os.environ["IMAGE"], "sha": os.environ["GITHUB_SHA"],
                            "version": version, "previous_image": os.environ["PREVIOUS"], "run_url": os.environ["RUN_URL"],
                            "checks": {r["check"]: r["status"] for r in rows},
                            "summary": ("failed: " + ", ".join(failed)) if failed else ""}))
          PY
          )
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $HANGAR_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$HANGAR_URL/api/admin/deploys" > /dev/null || echo "::warning::couldn't record the deploy in hangar"
      # A restarted hangar starts undrained; one that never restarted (set image failed, or the same image) doesn't
      - name: End the drain
        if: always() && steps.drain.outputs.began == 'true'
        run: |
          curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $HANGAR_TOKEN" "$HANGAR_URL/api/admin/drain" > /dev/null || true
