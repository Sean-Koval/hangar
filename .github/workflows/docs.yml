# The documentation site (mkdocs.yml, docs/) built with Zensical. Pull requests build it; main deploys it to GitHub Pages.
# Build it locally the same way: pip install zensical==0.0.71, then zensical build --strict (or zensical serve).
name: docs
on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - scripts/sync-brand.sh
      - .github/workflows/docs.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The committed diagrams are what diagram.py draws
        run: |
          python3 docs/assets/front/diagram.py
          git diff --exit-code -- docs/assets/diagrams docs/assets/front/hangar-suite.svg
      - name: The brand files are agent-factory's, at the commit docs/assets/brand/SOURCE records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/sync-brand.sh --check
      - name: Report drift from agent-factory main (a warning; re-run scripts/sync-brand.sh to take it)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/sync-brand.sh --check main || echo "::warning::agent-factory main has newer brand files; run sh scripts/sync-brand.sh <ref>"
      - run: pip install zensical==0.0.71
      # --strict: a broken link or anchor (a warning) fails the build instead of deploying with it
      - run: zensical build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
