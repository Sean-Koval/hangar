# The harness contract (docs/harnesses.md): the real agent CLIs, at the versions src/hangar/harnesses.lock.yaml pins,
# driven by hangar's driver offline against scripted model APIs (tests/test_*real_clis.py), plus the protocols the
# driver speaks with them, which must match the recorded ones (tests/fixtures/protocol). It runs the CLIs on PRs that
# touch harness, driver or isolation code, on every push to main and nightly (KAN-275: a CLI or runner change can break
# a guarantee on a quiet day; a failed nightly run opens or comments on one issue labelled `harness-contract`). Every
# PR runs the workflow so the required `contract` check always reports: on a PR that touches none of those paths the job is skipped, which counts as
# passing. The CLIs are cached by the lock and the recipes, so a run that finds them takes about a minute. It needs no secrets and never talks to the cluster.
name: harness-contract
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"  # KAN-275: nightly, 36 minutes before the canary (07:17 UTC)
  workflow_dispatch:

concurrency:
  group: harness-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: -p no:cacheprovider --durations=10
  UV_COMPILE_BYTECODE: "1"
  HANGAR_REQUIRE_CAPS: "1"  # KAN-138: a test that needs Docker, KVM or a uid split fails here, never skips

jobs:
  # A path filter on the trigger would leave the required `contract` check waiting forever on PRs it skips.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -Eq '^(src/hangar/harnesses\.py|src/hangar/harnesses\.lock\.yaml|src/hangar/driver\.py|src/hangar/harden\.py|src/hangar/isolation\.py|src/hangar/verifyloop\.py|src/hangar/steer\.py|src/hangar/govhook[^/]*\.py|src/hangar/cache\.py|src/hangar/events\.py|src/hangar/canary\.py|src/hangar/modelgw\.py|tests/test_[^/]*real_clis\.py|tests/test_codex_plugins\.py|tests/test_modelgw\.py|tests/test_cache\.py|tests/fixtures/live/.*|tests/fixtures/protocol/.*|\.github/workflows/harness\-contract\.yml)$' <<< "$changed"; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "harness contract needed: $run"

  contract:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0; pi's recipe bundles this node (it needs >= 22.19), as the pack builder's does
        with:
          node-version: "22"
      # Keyed on what decides the installs; an older entry is restored when the lock moved, and `install` redoes only
      # the harnesses whose recipe or version changed (each install records its pack digest).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/hangar-clis
          key: harness-clis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/hangar/harnesses.lock.yaml', 'src/hangar/harnesses.py') }}
          restore-keys: harness-clis-${{ runner.os }}-${{ runner.arch }}-
      - run: uv sync --all-extras --locked
      - name: Install the locked CLIs
        run: |
          uv run --locked python -m hangar.canary install --dest ~/.cache/hangar-clis --env-file "$GITHUB_ENV"
          echo "$HOME/.cache/hangar-clis/codex/libexec/codex-path" >> "$GITHUB_PATH"  # codex's bundled rg
      - name: Contract tests
        run: |
          uv run --locked pytest -v --junitxml junit-contract.xml tests/test_*real_clis.py tests/test_cache.py \
            tests/test_codex_plugins.py::test_the_real_codex_runs_exactly_the_trusted_hooks \
            tests/test_codex_plugins.py::test_the_real_codex_reports_the_lock_plugins_hooks_hangar_didnt_trust \
            tests/test_codex_plugins.py::test_a_real_codex_turn_fires_the_workflow_plugins_hooks_only_when_trusted \
            tests/test_modelgw.py::test_a_real_claude_code_turn_through_the_gateway
      - name: Every test ran
        if: always()
        run: |
          set -o pipefail
          uv run --locked python -m hangar.canary junit junit-contract.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: harness-contract
          path: junit-contract.xml
          if-no-files-found: ignore
          retention-days: 30

  # KAN-275: a nightly failure has no PR to show it, so it opens one issue (or comments on the open one) for on-call,
  # as the canary does. It runs none of the CLIs and holds only the issue permission.
  report:
    needs: contract
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="The nightly harness contract run failed against the locked CLIs: $RUN"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label harness-contract --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create harness-contract -R "$GITHUB_REPOSITORY" --color B60205 --force >/dev/null
            gh issue create -R "$GITHUB_REPOSITORY" --title "Nightly harness contract failed" --label harness-contract --body "$body"
          fi
