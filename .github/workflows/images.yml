# Environment images and harness packs, built before anyone waits (docs/gke.md, "Images and packs, built in CI").
# On every push to main, and by hand, `hangar images build` builds the image and pack tags this commit needs that
# Artifact Registry lacks, and pushes them. The cluster then finds them with one registry lookup instead of building
# on a create, and deploy/gke/up.sh has nothing left to build before rollout.
#
# It signs in to Google Cloud with Workload Identity Federation (no key). Three repository secrets, which
# deploy/gke/setup-cicd.sh sets (docs/cicd.md):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<project number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             <name>@<project>.iam.gserviceaccount.com, with roles/artifactregistry.writer on the repo
#   HANGAR_REGISTRY                 <region>-docker.pkg.dev/<project>/hangar (terraform -chdir=deploy/terraform/gke output registry)
# Without them (before setup, or on a fork) the job skips with a notice and stays green. The provider trusts only runs of
# main and v* tags, so on any other ref it skips too. It never talks to the cluster, so it works while the cluster is
# powered down.
name: images
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # --- ops: deploy.yml builds every tag before it rolls out

# One run at a time, never cancelled: a later push waits and then finds what this one pushed. --- infra-state: called
# from deploy.yml, github.workflow is the caller's name ("deploy"), so a deploy's build has a group of its own: in the
# push run's group, a newer push would cancel it while it waited, and the deploy with it.
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The control-plane image as main builds it, scanned with Trivy for code scanning (KAN-179,
  # docs/security/operations.md#vulnerability-management). It needs no secrets, so it runs before setup and on forks.
  # Only in this workflow's own push and dispatch runs: when deploy.yml calls it (github.workflow is "deploy"), the
  # push run for the same commit has scanned it already.
  scan:
    if: github.workflow == 'images'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write  # the SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hangar:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max  # main's layers, which pull requests' scans (security.yml) start from
      - uses: ./.github/actions/trivy-image
        with:
          image: hangar:scan

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write  # the OIDC token Workload Identity Federation exchanges
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HANGAR_REGISTRY: ${{ secrets.HANGAR_REGISTRY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ] || [ -z "$HANGAR_REGISTRY" ]; then
            echo "::notice title=images: skipped::Add the GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and HANGAR_REGISTRY secrets (deploy/gke/setup-cicd.sh, docs/cicd.md) to build environment images and harness packs here before rollout."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # --- cicd: the provider's condition admits only these refs; anything else would fail to sign in
            echo "::notice title=images: skipped::Google Cloud trusts only runs of main and v* tags (deploy/gke/setup-cicd.sh); this run is on $GITHUB_REF."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: steps.setup.outputs.ready == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.setup.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - if: steps.setup.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Registry login and disk space
        if: steps.setup.outputs.ready == 'true'
        run: |
          # The credential helper refreshes its token, so pushes late in a long run still authenticate.
          gcloud auth configure-docker "${HANGAR_REGISTRY%%/*}" --quiet
          # Environment images are a few GB each; drop toolchains this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Plan
        if: steps.setup.outputs.ready == 'true'
        run: |
          uv sync --locked
          status=0
          uv run --locked hangar images plan --provider kubernetes || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 3 ]  # 3: something is missing, which the next step builds
      - name: Build what's missing
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -o pipefail
          uv run --locked hangar images build --provider kubernetes --builder docker --jobs 2 --json \
            | tee images.json
      - name: Summary
        if: always() && steps.setup.outputs.ready == 'true'
        run: |
          [ -s images.json ] || exit 0
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          r = json.load(open("images.json"))
          print("| kind | name | status | ref |\n|---|---|---|---|")
          for i in r["items"]:
              print(f"| {i['kind']} | {i['name']}{'@' + i['version'] if i.get('version') else ''} | {i['status']} "
                    f"| `{i.get('ref') or i.get('tag', '')}` |")
          PY
      - if: always() && steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: images
          path: images.json
          if-no-files-found: ignore
          retention-days: 30
