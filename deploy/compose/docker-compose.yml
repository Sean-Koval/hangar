# Laptop or single VM: hangar in a container driving the host's Docker engine.
#   cp .env.example .env && docker compose up -d
#   open http://localhost:8787  (token: docker compose logs hangar | grep -A1 Bootstrap)
services:
  hangar:
    build: ../..
    image: hangar:local
    restart: unless-stopped
    ports:
      - "${HANGAR_BIND:-127.0.0.1}:8787:8787"
    environment:
      HANGAR_PUBLIC_URL: ${HANGAR_PUBLIC_URL:-http://localhost:8787}
      HANGAR_ADMIN_TOKEN: ${HANGAR_ADMIN_TOKEN:-}
      HANGAR_SECRET_KEY: ${HANGAR_SECRET_KEY:-}
      HANGAR_DOCKER_RUNTIME: ${HANGAR_DOCKER_RUNTIME:-}   # runsc (gVisor) or kata on Linux hosts
      HANGAR_MAX_SANDBOXES: ${HANGAR_MAX_SANDBOXES:-20}
      # --- isolation: sandboxes run on hangar's own network (hangar-sandboxes), where they can't reach each other or
      # this container; hangar reaches them with docker exec (docs/security/docker-network.md)
      HANGAR_ENV_DIRS: '["/app/envs", "/envs"]'
      # --- intake posture (docs/security/front-doors.md#intake-posture): jobs from GitHub, Jira, Slack and inbound webhooks need
      # the git gateway, and their sandboxes get at least `allowlist` egress through hangar's proxy on the
      # hangar-egress network's gateway address. A control plane inside this container can't listen there, so under
      # enforce such jobs are refused (no gateway) or fail to start (an open environment) with a message saying so;
      # nothing runs unfenced. For intake on this host run `hangar serve` on the host itself with HANGAR_GATEWAY_URL
      # (docs/security/git-gateway.md), or set HANGAR_INTAKE_POSTURE=warn and accept the risk.
      HANGAR_INTAKE_POSTURE: ${HANGAR_INTAKE_POSTURE:-enforce}
      # HANGAR_GATEWAY_URL: http://host.docker.internal:8788
    # The image runs as uid 1000 (KAN-170). Here it needs the host's Docker socket, which only root can open:
    # that socket is root on the host already, so root in this container adds nothing to it.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # sandboxes run as sibling containers
      - hangar-data:/data
      - ../../envs:/envs                            # edit specs on the host, live
volumes:
  hangar-data:
