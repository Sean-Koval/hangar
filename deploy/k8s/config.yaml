apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar
  namespace: hangar
data:
  HANGAR_HOST: "0.0.0.0"
  HANGAR_PUBLIC_URL: "https://hangar.example.com"
  HANGAR_DEFAULT_PROVIDER: "kubernetes"
  HANGAR_ENABLED_PROVIDERS: '["kubernetes"]'
  HANGAR_K8S_IN_CLUSTER: "true"
  HANGAR_K8S_NAMESPACE: "hangar-sandboxes"
  HANGAR_K8S_RUNTIME_CLASS: "gvisor"        # kata-qemu-runtime-rs for microVM pools, "" for runc
  HANGAR_REGISTRY: "REGION-docker.pkg.dev/PROJECT_ID/hangar"
  HANGAR_K8S_BUILD_SERVICE_ACCOUNT: "hangar@PROJECT_ID.iam.gserviceaccount.com"  # Cloud Build runs as this
  HANGAR_MAX_SANDBOXES: "120"               # a team of 6 × 10 sessions plus jobs (docs/team-scale.md)
  HANGAR_K8S_POD_SNAPSHOTS: "false"         # true after applying pod-snapshots.yaml (full-state forks)
  # Durable session checkpoints (docs/sessions.md). deploy/gke/up.sh sets it from `terraform output session_bucket`.
  # HANGAR_SESSION_STORE: "gs://PROJECT_ID-hangar-sessions"
  # Git credential gateway (docs/security.md): jobs and sessions push through hangar, no GitHub token in sandboxes.
  # HANGAR_GATEWAY_URL: "http://hangar-gateway.hangar.svc:8788"
  # HANGAR_GATEWAY_CREDENTIAL: "github-app"  # vault credential (github_app or git_token) used upstream
  # Egress allowlists (docs/security.md#egress-allowlists): sandboxes of an `allowlist`/`none` environment reach the
  # internet only through hangar's egress proxy on the gateway Service. HANGAR_EGRESS_DEFAULT applies to environments
  # that don't set egress.mode.
  # HANGAR_EGRESS_URL: "http://hangar-gateway.hangar.svc:3128"
  # HANGAR_EGRESS_DEFAULT: "allowlist"
---
# Create the real secret out of band (never commit it):
#   kubectl -n hangar create secret generic hangar \
#     --from-literal=HANGAR_ADMIN_TOKEN=hgr_$(openssl rand -hex 24) \
#     --from-literal=HANGAR_SECRET_KEY=$(python3 -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
