apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar
  namespace: hangar
data:
  HANGAR_HOST: "0.0.0.0"
  HANGAR_PUBLIC_URL: "https://hangar.example.com"
  HANGAR_DEFAULT_PROVIDER: "kubernetes"
  HANGAR_ENABLED_PROVIDERS: '["kubernetes"]'
  HANGAR_K8S_IN_CLUSTER: "true"
  HANGAR_K8S_NAMESPACE: "hangar-sandboxes"
  HANGAR_K8S_RUNTIME_CLASS: "gvisor"        # kata-qemu-runtime-rs for microVM pools, "" for runc
  HANGAR_REGISTRY: "REGION-docker.pkg.dev/PROJECT_ID/hangar"
  HANGAR_K8S_BUILD_SERVICE_ACCOUNT: "hangar@PROJECT_ID.iam.gserviceaccount.com"  # Cloud Build runs as this
  HANGAR_MAX_SANDBOXES: "120"               # a team of 6 × 10 sessions plus jobs (docs/team-scale.md)
  HANGAR_K8S_POD_SNAPSHOTS: "false"         # true after applying pod-snapshots.yaml (full-state forks)
  # Durable session checkpoints (docs/sessions.md). deploy/gke/up.sh sets it from `terraform output session_bucket`.
  # HANGAR_SESSION_STORE: "gs://PROJECT_ID-hangar-sessions"
  # Run capture for flightdeck's compactor (docs/api/outbox.md). deploy/gke/up.sh sets it from
  # `terraform output run_bucket` (enable_run_bucket, on by default).
  # HANGAR_OUTBOX_URL: "gs://PROJECT_ID-hangar-runs"
  # `hangar power up` runs this Cloud Run job (docs/gke.md section 6). deploy/gke/up.sh sets it from
  # `terraform output power_up_job` when the power schedule is on.
  # HANGAR_POWER_UP_JOB: "projects/PROJECT_ID/locations/REGION/jobs/hangar-power-up"
  # Git credential gateway (docs/security.md): jobs and sessions push through hangar, no GitHub token in sandboxes.
  # On by default (gateway.yaml adds the Service): intake-triggered jobs need it (HANGAR_INTAKE_POSTURE below).
  HANGAR_GATEWAY_URL: "http://hangar-gateway.hangar.svc:8788"
  # HANGAR_GATEWAY_CREDENTIAL: "github-app"  # vault credential (github_app or git_token) used upstream
  # Egress allowlists (docs/security.md#egress-allowlists): sandboxes of an `allowlist`/`none` environment, and every
  # intake-triggered job's sandbox, reach the internet only through hangar's egress proxy on the gateway Service.
  # HANGAR_EGRESS_DEFAULT applies to environments that don't set egress.mode.
  HANGAR_EGRESS_URL: "http://hangar-gateway.hangar.svc:3128"
  # HANGAR_EGRESS_DEFAULT: "allowlist"
  # Intake posture (docs/security.md#intake-posture): jobs from GitHub, Jira, Slack, GitHub Projects and inbound
  # webhooks need the gateway and get at least `allowlist` egress. "warn" for one release while you set the gateway
  # up (docs/upgrading.md); "off" is not recommended.
  HANGAR_INTAKE_POSTURE: "enforce"
  # --- heavy: the heavy tier (docs/environments.md#the-heavy-tier, docs/gke.md section 4a): Docker inside Kata
  # sandboxes on the sandboxes-heavy pool (enable_heavy_pool), and the large/xlarge profiles. Keep the other tiers.
  # HANGAR_TIERS: '{"fast": ["e2b"], "isolated": ["kubernetes"], "heavy": ["kubernetes"]}'
  # HANGAR_HEAVY_REGISTRY_MIRRORS: '["https://mirror.gcr.io"]'
  # HANGAR_HEAVY_MIRROR: "true"           # Docker Hub through hangar's read-only pull-through (needs the gateway)
  # HANGAR_HEAVY_MIRROR_UPSTREAM: "https://REGION-docker.pkg.dev/PROJECT_ID/dockerhub"  # terraform output dockerhub_mirror
---
# Create the real secret out of band (never commit it):
#   kubectl -n hangar create secret generic hangar \
#     --from-literal=HANGAR_ADMIN_TOKEN=hgr_$(openssl rand -hex 24) \
#     --from-literal=HANGAR_SECRET_KEY=$(python3 -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
