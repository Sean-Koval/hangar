apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hangar-data
  namespace: hangar
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangar
  namespace: hangar
spec:
  replicas: 1                 # state is a single SQLite file on the PVC
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hangar}
  template:
    metadata:
      labels: {app: hangar}
    spec:
      serviceAccountName: hangar
      # The Service is named "hangar", so Kubernetes' legacy service-link env vars would inject
      # HANGAR_PORT=tcp://... and collide with hangar's own HANGAR_* settings.
      enableServiceLinks: false
      # SIGTERM -> long-polls answer at once, streams cut after HANGAR_SHUTDOWN_GRACE_SECONDS (15), then hangar's own
      # shutdown. Sandboxes and sessions outlive the pod, so no checkpoint has to fit in here (docs/gke.md, Shutdown).
      terminationGracePeriodSeconds: 45
      securityContext:  # the image's user (KAN-170); the container's hardening below (KAN-174 L-8)
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hangar
          image: REGION-docker.pkg.dev/PROJECT_ID/hangar/control-plane:latest
          ports: [{containerPort: 8787, name: http}, {containerPort: 8788, name: gateway},
                  {containerPort: 3128, name: egress}]  # gateway, egress: gateway.yaml
          envFrom:
            - configMapRef: {name: hangar}
            # Site settings that deploy/gke/up.sh never overwrites. Optional: `hangar config set` / `hangar setup`
            # keep settings in hangar's database instead (docs/gke.md §2a); keys set here win over those.
            - configMapRef: {name: hangar-site, optional: true}
            - secretRef: {name: hangar}
          # KAN-174 L-8: no privilege escalation, no capabilities, the runtime's seccomp profile and a read-only root.
          # hangar writes only to /data (the PVC), /tmp (build contexts, fork and snapshot archives) and its home
          # (gcloud's and docker's config for in-cluster builds), each a volume below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/hangar}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          # A team of 6 × 10 sessions (docs/team-scale.md): ~0.2-0.5 of a core and ~300 MB measured on the fake
          # provider, plus up to HANGAR_WORKSPACE_TRANSFER_MB (1 GiB) of fork and snapshot archives in flight.
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 3Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hangar-data}
        # Up to HANGAR_WORKSPACE_TRANSFER_MB (1 GiB) of archives in flight, plus build contexts.
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        - name: home
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hangar
  namespace: hangar
  annotations:
    cloud.google.com/backend-config: '{"default": "hangar"}'
spec:
  selector: {app: hangar}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Long-lived websockets (terminals) and slow MCP tool calls need a long backend timeout.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: hangar
  namespace: hangar
spec:
  timeoutSec: 3600
  healthCheck:
    requestPath: /healthz
  # Identity-Aware Proxy: off, because it would stop the webhooks, MCP and CLI clients that send hangar tokens.
  # docs/security/control-plane-pod.md says when to turn it on, and how.
  # iap: {enabled: true, oauthclientCredentials: {secretName: iap-oauth}}
