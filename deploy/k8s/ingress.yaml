apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: hangar
  namespace: hangar
spec:
  domains: ["hangar.example.com"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hangar
  namespace: hangar
  annotations:
    kubernetes.io/ingress.global-static-ip-name: hangar-ip
    networking.gke.io/managed-certificates: hangar
    kubernetes.io/ingress.allow-http: "false"
spec:
  defaultBackend:
    service:
      name: hangar
      port: {number: 80}
