apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - config.yaml
  - deployment.yaml
  - ingress.yaml
  - gateway.yaml
  - control-plane-network.yaml  # KAN-174 L-8: who may reach the control plane
  - sandbox-network.yaml
  - envd-network.yaml
  - heavy-policy.yaml  # --- heavy: privileged sandbox pods only under Kata
# Terraform prints the values to drop in here (project, region, domain):
#   kustomize edit set image REGION-docker.pkg.dev/PROJECT_ID/hangar/control-plane=<your image>
