apiVersion: v1
kind: ServiceAccount
metadata:
  name: hangar
  namespace: hangar
  annotations:
    # Workload Identity: lets the control plane push images / run Cloud Build. Set by Terraform output.
    iam.gke.io/gcp-service-account: hangar@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hangar-sandboxes
  namespace: hangar-sandboxes
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["podsnapshot.gke.io"]
    resources: ["podsnapshots", "podsnapshotmanualtriggers"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hangar-sandboxes
  namespace: hangar-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hangar-sandboxes
subjects:
  - kind: ServiceAccount
    name: hangar
    namespace: hangar
