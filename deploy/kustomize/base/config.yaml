# Portable defaults. Your overlay's `hangar-site` ConfigMap holds what is yours (HANGAR_PUBLIC_URL, HANGAR_REGISTRY,
# HANGAR_SESSION_STORE, doors, plugins, egress); the Deployment reads it after this one, so its keys win. Settings
# made with `hangar config set` live in hangar's database; keys in either ConfigMap win over those.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar
  namespace: hangar
data:
  HANGAR_HOST: "0.0.0.0"
  HANGAR_DEFAULT_PROVIDER: "kubernetes"
  HANGAR_ENABLED_PROVIDERS: '["kubernetes"]'
  HANGAR_K8S_IN_CLUSTER: "true"
  HANGAR_K8S_NAMESPACE: "hangar-sandboxes"
  HANGAR_K8S_RUNTIME_CLASS: "gvisor"        # kata-qemu-runtime-rs for microVM pools, "" for runc (not recommended)
  HANGAR_MAX_SANDBOXES: "120"               # a team of 6 x 10 sessions plus jobs (docs/team-scale.md)
  HANGAR_K8S_POD_SNAPSHOTS: "false"
  # Git credential gateway and egress proxy (docs/security/README.md); gateway.yaml adds their Service.
  HANGAR_GATEWAY_URL: "http://hangar-gateway.hangar.svc:8788"
  HANGAR_EGRESS_URL: "http://hangar-gateway.hangar.svc:3128"
  # Environments that don't set egress.mode go through the proxy (KAN-174). Set "open" in hangar-site to go back, or
  # give one environment `egress: {mode: open}` (docs/security/egress-default.md).
  HANGAR_EGRESS_DEFAULT: "allowlist"
  HANGAR_INTAKE_POSTURE: "enforce"
  # No uid split in one Kubernetes container (KAN-165): `required` refuses an `ask` or `deny-risky` turn rather than run
  # its driver as the agent's own user. `auto` turns are unaffected. Keep it: with HANGAR_K8S_DRIVER_SIDECAR on (after
  # docs/security/driver-sidecar-check.md), it lets those turns run where the pod's sidecar passes the probe.
  HANGAR_UID_SPLIT: "required"
  # Credentials whose value is a mounted file (docs/deploy-company.md#credentials-from-your-secret-manager): the
  # Deployment mounts Secret hangar-credentials here, and a credential may only reference a file in this directory.
  HANGAR_SECRETS_DIR: "/var/run/hangar-secrets"
