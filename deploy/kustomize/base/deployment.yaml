apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hangar-data
  namespace: hangar
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangar
  namespace: hangar
spec:
  replicas: 1                 # state is a single SQLite file on the PVC
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hangar}
  template:
    metadata:
      labels: {app: hangar}
    spec:
      serviceAccountName: hangar
      # The Service is named "hangar": legacy service-link env vars would inject HANGAR_PORT=tcp://... and collide
      # with hangar's own settings.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:  # the image's user (KAN-170); the container's hardening below (KAN-174 L-8)
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hangar
          image: ghcr.io/sean-koval/hangar
          ports: [{containerPort: 8787, name: http}, {containerPort: 8788, name: gateway},
                  {containerPort: 3128, name: egress}]  # gateway, egress: gateway.yaml
          envFrom:
            - configMapRef: {name: hangar}
            - configMapRef: {name: hangar-site, optional: true}  # your overlay's settings; they win
            # HANGAR_ADMIN_TOKEN and HANGAR_SECRET_KEY: kubectl create secret, or the external-secrets component
            - secretRef: {name: hangar}
          # KAN-174 L-8: no privilege escalation, no capabilities, the runtime's seccomp profile and a read-only root.
          # hangar writes only to /data (the PVC), /tmp (build contexts, fork and snapshot archives) and its home
          # (gcloud's and docker's config for in-cluster builds), each a volume below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/hangar}
            - {name: credentials, mountPath: /var/run/hangar-secrets, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 3Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hangar-data}
        # Up to HANGAR_WORKSPACE_TRANSFER_MB (1 GiB) of archives in flight, plus build contexts.
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        - name: home
          emptyDir: {sizeLimit: 256Mi}
        # Credentials from your secret manager, one file per credential (the external-secrets component fills it).
        # Optional: hangar starts without it, and a credential that references a missing file has no value.
        - name: credentials
          secret: {secretName: hangar-credentials, optional: true, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: hangar
  namespace: hangar
spec:
  selector: {app: hangar}
  ports: [{name: http, port: 80, targetPort: http}]
