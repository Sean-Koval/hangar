# hangar-envd (docs/envd.md): the control plane calls each sandbox's daemon at its pod IP on port 49983, instead of
# going through the Kubernetes API for every exec.
#
# sandbox-network.yaml denies all ingress to sandbox pods. NetworkPolicies add up, so this opens exactly one way in:
# from hangar's own pods, to that port. Other sandboxes still can't connect to it (or to anything else in a sandbox).
# Without this policy, or with a CNI that drops the traffic anyway, hangar notices the daemon is unreachable and keeps
# using exec through the API server. Requires a CNI that enforces NetworkPolicy (GKE Dataplane V2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hangar-envd
  namespace: hangar-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: hangar}
          podSelector:
            matchLabels: {app: hangar}
      ports: [{protocol: TCP, port: 49983}]
