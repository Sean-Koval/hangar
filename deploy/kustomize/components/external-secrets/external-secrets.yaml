apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hangar
  namespace: hangar
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: set-by-hangar-deploy}
  target:
    name: hangar
    creationPolicy: Owner
  data:
    - secretKey: HANGAR_ADMIN_TOKEN    # hgr_ followed by 48 hex digits: hgr_$(openssl rand -hex 24)
      remoteRef: {key: hangar-admin-token}
    # Fernet keys, newest first, comma-separated: they seal hangar's vault. Rotate by putting a new key first, then
    # `hangar admin rotate-key` (docs/security/README.md); dropping the old key before that loses what it sealed.
    - secretKey: HANGAR_SECRET_KEY
      remoteRef: {key: hangar-secret-key}
---
# Every secret named hangar-credential-<name> becomes the file /var/run/hangar-secrets/<name>. Providers without
# `find` by name (or to list them explicitly): replace dataFrom with a `data` list in your overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hangar-credentials
  namespace: hangar
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: set-by-hangar-deploy}
  target:
    name: hangar-credentials
    creationPolicy: Owner
  dataFrom:
    - find:
        name: {regexp: "^hangar-credential-"}
      rewrite:
        - regexp: {source: "^hangar-credential-(.*)$", target: "$1"}
