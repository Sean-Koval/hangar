# Long-lived websockets (terminals) and slow MCP tool calls need a long backend timeout.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: hangar
  namespace: hangar
spec:
  timeoutSec: 3600
  healthCheck:
    requestPath: /healthz
  # Identity-Aware Proxy: off, because it would stop the webhooks, MCP and CLI clients that send hangar tokens.
  # docs/security/control-plane-pod.md says when to turn it on, and how.
  # iap: {enabled: true, oauthclientCredentials: {secretName: iap-oauth}}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: hangar
  namespace: hangar
spec:
  domains: ["set-by-hangar-deploy"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hangar
  namespace: hangar
  annotations:
    kubernetes.io/ingress.global-static-ip-name: set-by-hangar-deploy
    networking.gke.io/managed-certificates: hangar
    kubernetes.io/ingress.allow-http: "false"
spec:
  defaultBackend:
    service:
      name: hangar
      port: {number: 80}
---
# KAN-174 L-8: the load balancer and its health checks reach the API port from Google's front ends
# (cloud.google.com/load-balancing/docs/health-checks#firewall_rules); container-native load balancing sends them
# straight to the pod. control-plane-network.yaml has the rest of who may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hangar-ingress-gclb
  namespace: hangar
spec:
  podSelector:
    matchLabels: {app: hangar}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 35.191.0.0/16}}, {ipBlock: {cidr: 130.211.0.0/22}}]
      ports: [{protocol: TCP, port: 8787}]
