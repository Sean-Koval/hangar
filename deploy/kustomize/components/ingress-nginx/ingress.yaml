apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hangar
  namespace: hangar
  annotations:
    # Long-lived websockets (terminals) and slow MCP tool calls; fork and snapshot archives of up to
    # HANGAR_WORKSPACE_TRANSFER_MB (1 GiB by default).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["set-by-hangar-deploy"]
      secretName: hangar-tls
  rules:
    - host: set-by-hangar-deploy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hangar
                port: {number: 80}
---
# KAN-174 L-8: the controller's pods reach the API port (control-plane-network.yaml has the rest of who may connect).
# Another namespace or labels: patch this policy's `from` in your overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hangar-ingress-nginx
  namespace: hangar
spec:
  podSelector:
    matchLabels: {app: hangar}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ingress-nginx}
      ports: [{protocol: TCP, port: 8787}]
