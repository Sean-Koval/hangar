<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Hangar</title>
  <desc id="desc">A custom H emblem formed by four separate workspace enclosures joined through a vermilion bridge, beside the Hangar wordmark on a warm off-white background.</desc>
  <rect width="1280" height="320" fill="#eeeae2"/>
  <g transform="translate(86 56)">
    <!-- Four enclosed bays stay distinct; the central bridge connects them into an H. -->
    <path d="M0 0H70V88H48V22H22V88H0Z" fill="#262923"/>
    <path d="M0 120H22V186H48V120H70V208H0Z" fill="#262923"/>
    <path d="M150 0H220V88H198V22H172V88H150Z" fill="#262923"/>
    <path d="M150 120H172V186H198V120H220V208H150Z" fill="#262923"/>
    <path d="M0 94H96V74H124V94H220V114H124V134H96V114H0Z" fill="#c4492d"/>
  </g>
  <text x="388" y="207" fill="#262923" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="116" font-weight="700" letter-spacing="-5">Hangar</text>
</svg>
