<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 396" role="img" aria-label="A2A: a message in, a task out">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
  .af-d .lbl-s { font: 500 11.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
</style>
<defs><marker id="a2a-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="396"/><rect class="person" x="20" y="20" width="270" height="64" rx="3"/><text class="name-s" x="38" y="46">A2A client</text><text class="body" x="38" y="68">ADK, AX or any other</text><path class="edge" d="M155 84V122" marker-end="url(#a2a-stacked-arrow)"/><text class="elabel" x="165" y="108" text-anchor="start">SendMessage</text><rect class="box-hub" x="20" y="124" width="270" height="64" rx="3"/><text class="name-s" x="38" y="150">/a2a</text><text class="body" x="38" y="172">SendMessage in</text><path class="edge" d="M155 188V226" marker-end="url(#a2a-stacked-arrow)"/><rect class="box" x="20" y="228" width="270" height="82" rx="3"/><text class="name-s" x="38" y="254">Job</text><text class="body" x="38" y="276">queue, sandbox, agent,</text><text class="body" x="38" y="294">verify, PR</text><path class="edge" d="M290 280H324V52H292" marker-end="url(#a2a-stacked-arrow)"/><text class="elabel" x="340" y="165" text-anchor="middle" transform="rotate(-90 340 165)">Task, status updates (SSE), push</text><path class="edge-plan" d="M155 310V340" marker-end="url(#a2a-stacked-arrow)"/><text class="elabel" x="20" y="362" text-anchor="start">SendMessage with the same contextId:</text><text class="elabel" x="20" y="378" text-anchor="start">a follow-up turn on the same job and branch</text></svg>
