<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 406" role="img" aria-label="A2A: a message in, a task out">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="a2a-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="406"/><rect class="person" x="20" y="16" width="268" height="68" rx="12"/><text class="name-s" x="36" y="44">A2A client</text><text class="body" x="36" y="66">ADK, AX or any other client</text><path class="edge" d="M60 84V122" marker-end="url(#a2a-stacked-arrow)"/><rect class="box-hub" x="20" y="124" width="268" height="68" rx="12"/><clipPath id="a2a-stacked-pe20-124-268-68"><rect x="20" y="124" width="268" height="68" rx="12"/></clipPath><rect x="20" y="124" width="268" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#a2a-stacked-pe20-124-268-68)"/><text class="name-s" x="36" y="152">/a2a</text><text class="body" x="36" y="174">SendMessage in; hangar admits it</text><path class="edge" d="M60 192V230" marker-end="url(#a2a-stacked-arrow)"/><rect class="box" x="20" y="232" width="268" height="86" rx="12"/><text class="name-s" x="36" y="260">Job</text><text class="body" x="36" y="282">queue, sandbox, agent, verify,</text><text class="body" x="36" y="300">draft PR</text><path class="edge" d="M288 275H306V50H290" marker-end="url(#a2a-stacked-arrow)"/><text class="elabel" x="330" y="167" text-anchor="middle" transform="rotate(-90 330 167)">the Task and its updates (SSE)</text><path class="edge-plan" d="M60 318V348" marker-end="url(#a2a-stacked-arrow)"/><text class="elabel" x="20" y="370" text-anchor="start">SendMessage with the same contextId:</text><text class="elabel" x="20" y="388" text-anchor="start">a follow-up turn on the same job and branch</text></svg>
