<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" role="img" aria-label="A2A: a message in, a task out">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="a2a:-a-message-in,-a-tas-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="206"/><rect class="person" x="20" y="40" width="180" height="64" rx="3"/><text class="name-s" x="38" y="66">A2A client</text><text class="body" x="38" y="88">ADK, AX or any other</text><rect class="box-hub" x="300" y="40" width="140" height="64" rx="3"/><rect x="300" y="40" width="140" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="name-s" x="318" y="66">/a2a</text><text class="body" x="318" y="88">SendMessage in</text><rect class="box" x="540" y="40" width="240" height="64" rx="3"/><text class="name-s" x="558" y="66">Job</text><text class="body" x="558" y="88">queue, sandbox, agent, verify, PR</text><path class="edge" d="M200 72H298" marker-end="url(#a2a:-a-message-in,-a-tas-arrow)"/><text class="elabel" x="249" y="64" text-anchor="middle">SendMessage</text><path class="edge" d="M440 72H538" marker-end="url(#a2a:-a-message-in,-a-tas-arrow)"/><path class="edge" d="M610 104V150H110V106" marker-end="url(#a2a:-a-message-in,-a-tas-arrow)"/><text class="elabel" x="360" y="144" text-anchor="middle">Task, status updates (SSE), push notifications</text><path class="edge-plan" d="M110 104V186H660V106" marker-end="url(#a2a:-a-message-in,-a-tas-arrow)"/><text class="elabel" x="385" y="180" text-anchor="middle">SendMessage with the same contextId: a follow-up turn on the same job and branch</text></svg>
