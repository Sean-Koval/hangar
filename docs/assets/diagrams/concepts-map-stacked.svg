<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 638" role="img" aria-label="People, front doors, the control plane and sandboxes">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="concepts-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="638"/><rect class="person" x="20" y="16" width="310" height="126" rx="12"/><text class="lbl" x="36" y="44">Who</text><text class="name-s" x="36" y="66">People and tools</text><text class="body" x="36" y="88">MCP clients, the CLI, the browser;</text><text class="body" x="36" y="106">Jira, GitHub, Slack; services,</text><text class="body" x="36" y="124">CI and other agents</text><path class="edge" d="M60 142V174" marker-end="url(#concepts-stacked-arrow)"/><rect class="box" x="20" y="176" width="310" height="126" rx="12"/><text class="lbl" x="36" y="204">Work in</text><text class="name-s" x="36" y="226">Front doors</text><text class="body" x="36" y="248">MCP, REST and the CLI; GitHub,</text><text class="body" x="36" y="266">Jira and Slack; webhooks</text><text class="body" x="36" y="284">and schedules</text><path class="edge" d="M60 302V334" marker-end="url(#concepts-stacked-arrow)"/><text class="elabel" x="70" y="324" text-anchor="start">jobs and sessions</text><rect class="box-hub" x="20" y="336" width="310" height="126" rx="12"/><clipPath id="concepts-stacked-pe20-336-310-126"><rect x="20" y="336" width="310" height="126" rx="12"/></clipPath><rect x="20" y="336" width="310" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#concepts-stacked-pe20-336-310-126)"/><text class="lbl" x="36" y="364">hangar</text><text class="name-s" x="36" y="386">Control plane</text><text class="body" x="36" y="408">Jobs and sessions; policy, people</text><text class="body" x="36" y="426">and budgets; the vault and the</text><text class="body" x="36" y="444">gateway; verify, PR, landing</text><path class="edge" d="M60 462V494" marker-end="url(#concepts-stacked-arrow)"/><text class="elabel" x="70" y="484" text-anchor="start">runs</text><rect class="box-ext" x="20" y="496" width="310" height="126" rx="12"/><text class="lbl" x="36" y="524">Work runs</text><text class="name-s" x="36" y="546">Sandboxes</text><text class="body" x="36" y="568">An environment, a harness and the</text><text class="body" x="36" y="586">repo's checkout, isolated:</text><text class="body" x="36" y="604">Docker, GKE or E2B</text></svg>
