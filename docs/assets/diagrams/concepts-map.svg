<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" role="img" aria-label="People, front doors, the control plane and sandboxes">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="concepts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="680" height="328"/><rect class="person" x="16" y="16" width="300" height="126" rx="12"/><text class="lbl" x="32" y="44">Who</text><text class="name-s" x="32" y="66">People and tools</text><text class="body" x="32" y="88">MCP clients, the CLI, the browser;</text><text class="body" x="32" y="106">Jira, GitHub, Slack; services,</text><text class="body" x="32" y="124">CI and other agents</text><rect class="box" x="364" y="16" width="300" height="126" rx="12"/><text class="lbl" x="380" y="44">Work in</text><text class="name-s" x="380" y="66">Front doors</text><text class="body" x="380" y="88">MCP, REST and the CLI; GitHub,</text><text class="body" x="380" y="106">Jira, Projects and Slack;</text><text class="body" x="380" y="124">webhooks, schedules, A2A</text><rect class="box-hub" x="364" y="186" width="300" height="126" rx="12"/><clipPath id="concepts-pe364-186-300-126"><rect x="364" y="186" width="300" height="126" rx="12"/></clipPath><rect x="364" y="186" width="300" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#concepts-pe364-186-300-126)"/><text class="lbl" x="380" y="214">hangar</text><text class="name-s" x="380" y="236">Control plane</text><text class="body" x="380" y="258">Jobs and sessions; policy, people</text><text class="body" x="380" y="276">and budgets; the vault and gateway;</text><text class="body" x="380" y="294">verify, branch, PR and landing</text><rect class="box-ext" x="16" y="186" width="300" height="126" rx="12"/><text class="lbl" x="32" y="214">Work runs</text><text class="name-s" x="32" y="236">Sandboxes</text><text class="body" x="32" y="258">An environment, a harness and the</text><text class="body" x="32" y="276">repo's checkout, isolated: Docker,</text><text class="body" x="32" y="294">GKE or E2B</text><path class="edge" d="M316 79H362" marker-end="url(#concepts-arrow)"/><path class="edge" d="M514 142V184" marker-end="url(#concepts-arrow)"/><path class="edge" d="M364 249H318" marker-end="url(#concepts-arrow)"/><text class="elabel" x="524" y="169" text-anchor="start">jobs and sessions</text><text class="elabel" x="340" y="241" text-anchor="middle">runs</text></svg>
