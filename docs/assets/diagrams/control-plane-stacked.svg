<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 570" role="img" aria-label="Inside the control plane">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
  .af-d .lbl-s { font: 500 11.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
</style>
<defs><marker id="control-plane-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="570"/><rect class="person" x="20" y="20" width="150" height="82" rx="3"/><text class="name-s" x="38" y="46">MCP client</text><text class="body" x="38" y="68">Codex, Claude Code,</text><text class="body" x="38" y="86">Cursor: HTTP + token</text><rect class="person" x="180" y="20" width="150" height="82" rx="3"/><text class="name-s" x="198" y="46">Browser</text><text class="body" x="198" y="68">The console: fleet,</text><text class="body" x="198" y="86">approvals, terminals</text><path class="edge" d="M95 102V136" marker-end="url(#control-plane-stacked-arrow)"/><path class="edge" d="M255 102V136" marker-end="url(#control-plane-stacked-arrow)"/><rect class="box-hub" x="20" y="138" width="310" height="176" rx="3"/><rect x="20" y="138" width="310" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl-s" x="38" y="164">HANGAR</text><text class="name-s" x="38" y="186">Control plane</text><text class="body" x="38" y="208">MCP tools, REST API,</text><text class="body" x="38" y="226">websocket PTYs, audit log</text><text class="body" x="38" y="244">Fleet manager: environments,</text><text class="body" x="38" y="262">warm pools, snapshots, forks</text><text class="body" x="38" y="280">Credential broker: vault,</text><text class="body" x="38" y="298">leases; git gateway</text><path class="edge" d="M175 314V348" marker-end="url(#control-plane-stacked-arrow)"/><text class="elabel" x="185" y="336" text-anchor="start">sandboxes, on one of</text><rect class="box-ext" x="20" y="350" width="310" height="60" rx="3"/><text class="name-s" x="38" y="376">Docker</text><text class="body" x="38" y="398">Laptop or one VM; gVisor, Kata</text><rect class="box-ext" x="20" y="420" width="310" height="60" rx="3"/><text class="name-s" x="38" y="446">Kubernetes</text><text class="body" x="38" y="468">GKE: Agent Sandbox CRDs</text><rect class="box-ext" x="20" y="490" width="310" height="60" rx="3"/><text class="name-s" x="38" y="516">E2B</text><text class="body" x="38" y="538">Firecracker microVMs</text></svg>
