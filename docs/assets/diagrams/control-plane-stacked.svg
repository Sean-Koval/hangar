<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 622" role="img" aria-label="Inside the control plane">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="control-plane-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="622"/><rect class="person" x="20" y="16" width="150" height="92" rx="12"/><text class="name-s" x="36" y="44">MCP client</text><text class="body" x="36" y="66">Codex, Claude</text><text class="body" x="36" y="84">Code, Cursor</text><rect class="person" x="180" y="16" width="150" height="92" rx="12"/><text class="name-s" x="196" y="44">Browser</text><text class="body" x="196" y="66">The console</text><path class="edge" d="M95 108V140" marker-end="url(#control-plane-stacked-arrow)"/><path class="edge" d="M255 108V140" marker-end="url(#control-plane-stacked-arrow)"/><rect class="box-hub" x="20" y="142" width="310" height="194" rx="12"/><clipPath id="control-plane-stacked-pe20-142-310-194"><rect x="20" y="142" width="310" height="194" rx="12"/></clipPath><rect x="20" y="142" width="310" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#control-plane-stacked-pe20-142-310-194)"/><text class="lbl" x="36" y="170">hangar</text><text class="name-s" x="36" y="192">Control plane</text><text class="body" x="36" y="214">MCP tools, the REST API,</text><text class="body" x="36" y="232">websocket terminals, the audit log</text><text class="body" x="36" y="250">Fleet manager: environments,</text><text class="body" x="36" y="268">warm pools, snapshots, forks</text><text class="body" x="36" y="286">Credential broker: the vault,</text><text class="body" x="36" y="304">leases, the git gateway</text><path class="edge" d="M60 336V374" marker-end="url(#control-plane-stacked-arrow)"/><text class="elabel" x="70" y="360" text-anchor="start">sandboxes, on one of</text><rect class="box-ext" x="20" y="376" width="310" height="70" rx="12"/><text class="name-s" x="36" y="404">Docker</text><text class="body" x="36" y="426">A laptop or one VM; gVisor, Kata</text><rect class="box-ext" x="20" y="456" width="310" height="70" rx="12"/><text class="name-s" x="36" y="484">Kubernetes</text><text class="body" x="36" y="506">GKE, with the Agent Sandbox CRDs</text><rect class="box-ext" x="20" y="536" width="310" height="70" rx="12"/><text class="name-s" x="36" y="564">E2B</text><text class="body" x="36" y="586">Firecracker microVMs</text></svg>
