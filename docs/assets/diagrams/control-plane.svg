<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-label="Inside the control plane">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="inside-the-control-plane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="396"/><rect class="person" x="60" y="20" width="300" height="60" rx="3"/><text class="name-s" x="78" y="46">MCP client</text><text class="body" x="78" y="68">Codex, Claude Code, Cursor: HTTP + token</text><rect class="person" x="440" y="20" width="300" height="60" rx="3"/><text class="name-s" x="458" y="46">Browser</text><text class="body" x="458" y="68">The console: fleet, approvals, live terminals</text><rect class="box-hub" x="60" y="120" width="680" height="126" rx="3"/><rect x="60" y="120" width="680" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="78" y="146">HANGAR</text><text class="name-s" x="78" y="168">Control plane</text><text class="body" x="78" y="190">MCP tools, REST API, websocket PTYs, audit log</text><text class="body" x="78" y="208">Fleet manager: environments (layered specs to images, warm pools), snapshots and forks, TTL reaper</text><text class="body" x="78" y="226">Credential broker: encrypted vault, leases; git gateway</text><path class="edge" d="M210 80V118" marker-end="url(#inside-the-control-plane-arrow)"/><path class="edge" d="M590 80V118" marker-end="url(#inside-the-control-plane-arrow)"/><rect class="box-ext" x="60" y="290" width="200" height="86" rx="3"/><text class="lbl" x="78" y="316">PROVIDER · SANDBOXES</text><text class="name-s" x="78" y="338">Docker</text><text class="body" x="78" y="360">Laptop or one VM; gVisor, Kata</text><rect class="box-ext" x="300" y="290" width="200" height="86" rx="3"/><text class="lbl" x="318" y="316">PROVIDER · SANDBOXES</text><text class="name-s" x="318" y="338">Kubernetes</text><text class="body" x="318" y="360">GKE: Agent Sandbox CRDs</text><rect class="box-ext" x="540" y="290" width="200" height="86" rx="3"/><text class="lbl" x="558" y="316">PROVIDER · SANDBOXES</text><text class="name-s" x="558" y="338">E2B</text><text class="body" x="558" y="360">Firecracker microVMs</text><path class="edge" d="M160 246V288" marker-end="url(#inside-the-control-plane-arrow)"/><path class="edge" d="M400 246V288" marker-end="url(#inside-the-control-plane-arrow)"/><path class="edge" d="M640 246V288" marker-end="url(#inside-the-control-plane-arrow)"/></svg>
