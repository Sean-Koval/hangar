<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" role="img" aria-label="Inside the control plane">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="control-plane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="680" height="444"/><rect class="person" x="16" y="16" width="312" height="74" rx="12"/><text class="name-s" x="32" y="44">MCP client</text><text class="body" x="32" y="66">Codex, Claude Code, Cursor: HTTP</text><rect class="person" x="352" y="16" width="312" height="74" rx="12"/><text class="name-s" x="368" y="44">Browser</text><text class="body" x="368" y="66">The console: fleet, approvals, terminals</text><path class="edge" d="M172 90V126" marker-end="url(#control-plane-arrow)"/><path class="edge" d="M508 90V126" marker-end="url(#control-plane-arrow)"/><rect class="box-hub" x="16" y="128" width="648" height="144" rx="12"/><clipPath id="control-plane-pe16-128-648-144"><rect x="16" y="128" width="648" height="144" rx="12"/></clipPath><rect x="16" y="128" width="648" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#control-plane-pe16-128-648-144)"/><text class="lbl" x="32" y="156">hangar</text><text class="name-s" x="32" y="178">Control plane</text><text class="body" x="32" y="200">MCP tools, the REST API, websocket terminals, the audit log</text><text class="body" x="32" y="218">Fleet manager: environments (layered specs to images, warm pools),</text><text class="body" x="32" y="236">snapshots and forks, the TTL reaper</text><text class="body" x="32" y="254">Credential broker: the encrypted vault, leases, the git gateway</text><text class="elabel" x="127" y="316" text-anchor="start">sandboxes, on one provider</text><path class="edge" d="M117 272V334" marker-end="url(#control-plane-arrow)"/><path class="edge" d="M339 272V334" marker-end="url(#control-plane-arrow)"/><path class="edge" d="M561 272V334" marker-end="url(#control-plane-arrow)"/><rect class="box-ext" x="16" y="336" width="202" height="92" rx="12"/><text class="name-s" x="32" y="364">Docker</text><text class="body" x="32" y="386">A laptop or one VM;</text><text class="body" x="32" y="404">gVisor or Kata</text><rect class="box-ext" x="238" y="336" width="202" height="92" rx="12"/><text class="name-s" x="254" y="364">Kubernetes</text><text class="body" x="254" y="386">GKE, with the Agent</text><text class="body" x="254" y="404">Sandbox CRDs</text><rect class="box-ext" x="460" y="336" width="202" height="92" rx="12"/><text class="name-s" x="476" y="364">E2B</text><text class="body" x="476" y="386">Firecracker</text><text class="body" x="476" y="404">microVMs</text></svg>
