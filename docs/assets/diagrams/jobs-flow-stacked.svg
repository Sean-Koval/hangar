<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 650" role="img" aria-label="A job, from the caller to a draft PR">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="jobs-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="650"/><rect class="person" x="20" y="16" width="268" height="68" rx="12"/><text class="name-s" x="36" y="44">Caller</text><text class="body" x="36" y="66">POST /api/jobs</text><path class="edge" d="M60 84V110" marker-end="url(#jobs-stacked-arrow)"/><rect class="box" x="20" y="112" width="268" height="68" rx="12"/><text class="name-s" x="36" y="140">Queue</text><text class="body" x="36" y="162">admitted, in its turn</text><path class="edge" d="M60 180V206" marker-end="url(#jobs-stacked-arrow)"/><rect class="box" x="20" y="208" width="268" height="68" rx="12"/><text class="name-s" x="36" y="236">Sandbox</text><text class="body" x="36" y="258">environment and harness</text><path class="edge" d="M60 276V302" marker-end="url(#jobs-stacked-arrow)"/><rect class="box" x="20" y="304" width="268" height="68" rx="12"/><text class="name-s" x="36" y="332">Agent turn</text><text class="body" x="36" y="354">edits and tests</text><path class="edge" d="M60 372V398" marker-end="url(#jobs-stacked-arrow)"/><rect class="box" x="20" y="400" width="268" height="68" rx="12"/><text class="name-s" x="36" y="428">Verify</text><text class="body" x="36" y="450">the repo's own check</text><path class="edge" d="M60 468V494" marker-end="url(#jobs-stacked-arrow)"/><rect class="box-ext" x="20" y="496" width="268" height="68" rx="12"/><text class="name-s" x="36" y="524">Draft PR</text><text class="body" x="36" y="546">branch hangar/&lt;job&gt;</text><path class="edge" d="M288 530H306V50H290" marker-end="url(#jobs-stacked-arrow)"/><text class="elabel" x="330" y="290" text-anchor="middle" transform="rotate(-90 330 290)">signed callback: job.started, job.finished</text><text class="elabel" x="20" y="596" text-anchor="start">An engineer follows up (the API, MCP,</text><text class="elabel" x="20" y="614" text-anchor="start">the CLI, /hangar on the PR) or opens</text><text class="elabel" x="20" y="632" text-anchor="start">the sandbox's terminal.</text></svg>
