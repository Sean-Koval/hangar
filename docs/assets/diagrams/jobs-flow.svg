<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="A job, from the caller to a draft PR">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="a-job,-from-the-caller-t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="200"/><rect class="person" x="20" y="40" width="122" height="64" rx="3"/><text class="name-s" x="38" y="66">Caller</text><text class="body" x="38" y="88">POST /api/jobs</text><rect class="box" x="151" y="40" width="122" height="64" rx="3"/><text class="name-s" x="169" y="66">Queue</text><text class="body" x="169" y="88">admitted</text><path class="edge" d="M142 72H149" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><rect class="box" x="282" y="40" width="122" height="64" rx="3"/><text class="name-s" x="300" y="66">Sandbox</text><text class="body" x="300" y="88">env + harness</text><path class="edge" d="M273 72H280" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><rect class="box" x="413" y="40" width="122" height="64" rx="3"/><text class="name-s" x="431" y="66">Agent turn</text><text class="body" x="431" y="88">edits, tests</text><path class="edge" d="M404 72H411" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><rect class="box" x="544" y="40" width="122" height="64" rx="3"/><text class="name-s" x="562" y="66">Verify</text><text class="body" x="562" y="88">the repo's check</text><path class="edge" d="M535 72H542" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><rect class="box-ext" x="675" y="40" width="122" height="64" rx="3"/><text class="name-s" x="693" y="66">Draft PR</text><text class="body" x="693" y="88">hangar/&lt;job&gt;</text><path class="edge" d="M666 72H673" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><path class="edge" d="M736 104V150H81V106" marker-end="url(#a-job,-from-the-caller-t-arrow)"/><text class="elabel" x="400" y="144" text-anchor="middle">signed callback: job.started, job.finished</text><text class="elabel" x="400" y="184" text-anchor="middle">An engineer follows up (API, MCP, CLI, /hangar on the PR) or attaches to the sandbox's terminal.</text></svg>
