<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" role="img" aria-label="A job, from the caller to a draft PR">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="jobs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="680" height="296"/><rect class="person" x="16" y="44" width="186" height="74" rx="12"/><text class="name-s" x="32" y="72">Caller</text><text class="body" x="32" y="94">POST /api/jobs</text><rect class="box" x="235" y="44" width="186" height="74" rx="12"/><text class="name-s" x="251" y="72">Queue</text><text class="body" x="251" y="94">admitted, in its turn</text><path class="edge" d="M202 81H233" marker-end="url(#jobs-arrow)"/><rect class="box" x="454" y="44" width="186" height="74" rx="12"/><text class="name-s" x="470" y="72">Sandbox</text><text class="body" x="470" y="94">environment, harness</text><path class="edge" d="M421 81H452" marker-end="url(#jobs-arrow)"/><rect class="box" x="16" y="170" width="186" height="74" rx="12"/><text class="name-s" x="32" y="198">Agent turn</text><text class="body" x="32" y="220">edits and tests</text><rect class="box" x="235" y="170" width="186" height="74" rx="12"/><text class="name-s" x="251" y="198">Verify</text><text class="body" x="251" y="220">the repo's own check</text><path class="edge" d="M202 207H233" marker-end="url(#jobs-arrow)"/><rect class="box-ext" x="454" y="170" width="186" height="74" rx="12"/><text class="name-s" x="470" y="198">Draft PR</text><text class="body" x="470" y="220">branch hangar/&lt;job&gt;</text><path class="edge" d="M421 207H452" marker-end="url(#jobs-arrow)"/><path class="edge" d="M547 118V144H109V168" marker-end="url(#jobs-arrow)"/><path class="edge" d="M640 207H654V26H109V42" marker-end="url(#jobs-arrow)"/><text class="elabel" x="328" y="18" text-anchor="middle">signed callback: job.started, job.finished</text><text class="elabel" x="16" y="278" text-anchor="start">An engineer follows up (the API, MCP, the CLI, /hangar on the PR) or opens the sandbox's terminal.</text></svg>
