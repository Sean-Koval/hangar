<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" role="img" aria-label="How a PR lands">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
  .af-d .lbl-s { font: 500 11.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
</style>
<defs><marker id="landing-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="500"/><rect class="box" x="20" y="20" width="270" height="56" rx="3"/><text class="name-s" x="38" y="46">Opened</text><text class="body" x="38" y="68">draft from hangar</text><path class="edge" d="M155 76V108" marker-end="url(#landing-stacked-arrow)"/><rect class="box" x="20" y="110" width="270" height="56" rx="3"/><text class="name-s" x="38" y="136">Open</text><text class="body" x="38" y="158">review packet</text><path class="edge" d="M155 166V198" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="165" y="187" text-anchor="start">an approver or code owner</text><rect class="box" x="20" y="200" width="270" height="56" rx="3"/><text class="name-s" x="38" y="226">Approved</text><text class="body" x="38" y="248">head approved</text><path class="edge" d="M155 256V288" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="165" y="277" text-anchor="start">checks green, no agent turn</text><rect class="box-hub" x="20" y="290" width="270" height="56" rx="3"/><text class="name-s" x="38" y="316">Armed</text><text class="body" x="38" y="338">auto-merge armed</text><path class="edge" d="M155 346V378" marker-end="url(#landing-stacked-arrow)"/><rect class="box-ext" x="20" y="380" width="270" height="56" rx="3"/><text class="name-s" x="38" y="406">Merged</text><text class="body" x="38" y="428">rules met</text><path class="edge" d="M290 330H324V138H292" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="340" y="234" text-anchor="middle" transform="rotate(-90 340 234)">disarmed, back to open</text><text class="elabel" x="20" y="466" text-anchor="start">Disarmed by a push, changes requested</text><text class="elabel" x="20" y="482" text-anchor="start">or a new agent turn.</text></svg>
