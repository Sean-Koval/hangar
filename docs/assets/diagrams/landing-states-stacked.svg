<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 476" role="img" aria-label="How a PR lands">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="landing-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="476"/><rect class="box" x="20" y="16" width="268" height="68" rx="12"/><text class="name-s" x="36" y="44">Open</text><text class="body" x="36" y="66">a draft from hangar, review packet</text><path class="edge" d="M60 84V122" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="70" y="109" text-anchor="start">an approver or code owner</text><rect class="box" x="20" y="124" width="268" height="68" rx="12"/><text class="name-s" x="36" y="152">Approved</text><text class="body" x="36" y="174">the head commit, by a person</text><path class="edge" d="M60 192V230" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="70" y="217" text-anchor="start">checks green, no agent turn</text><rect class="box-hub" x="20" y="232" width="268" height="68" rx="12"/><text class="name-s" x="36" y="260">Armed</text><text class="body" x="36" y="282">auto-merge, on that commit</text><path class="edge" d="M60 300V338" marker-end="url(#landing-stacked-arrow)"/><rect class="box-ext" x="20" y="340" width="268" height="68" rx="12"/><text class="name-s" x="36" y="368">Merged</text><text class="body" x="36" y="390">the base branch's rules met</text><path class="edge" d="M288 266H306V50H290" marker-end="url(#landing-stacked-arrow)"/><text class="elabel" x="330" y="158" text-anchor="middle" transform="rotate(-90 330 158)">disarmed, back to open</text><text class="elabel" x="20" y="440" text-anchor="start">A push, changes requested, a dismissed</text><text class="elabel" x="20" y="458" text-anchor="start">approval or a new agent turn disarms it.</text></svg>
