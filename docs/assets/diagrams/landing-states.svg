<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" role="img" aria-label="How a PR lands">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="landing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="680" height="224"/><rect class="box" x="16" y="40" width="136" height="92" rx="12"/><text class="name-s" x="32" y="68">Open</text><text class="body" x="32" y="90">hangar's draft,</text><text class="body" x="32" y="108">a review packet</text><rect class="box" x="186" y="40" width="136" height="92" rx="12"/><text class="name-s" x="202" y="68">Approved</text><text class="body" x="202" y="90">the head commit,</text><text class="body" x="202" y="108">by a person</text><path class="edge" d="M152 86H184" marker-end="url(#landing-arrow)"/><rect class="box-hub" x="356" y="40" width="136" height="92" rx="12"/><text class="name-s" x="372" y="68">Armed</text><text class="body" x="372" y="90">auto-merge, on</text><text class="body" x="372" y="108">that commit</text><path class="edge" d="M322 86H354" marker-end="url(#landing-arrow)"/><rect class="box-ext" x="526" y="40" width="136" height="92" rx="12"/><text class="name-s" x="542" y="68">Merged</text><text class="body" x="542" y="90">the base branch's</text><text class="body" x="542" y="108">rules met</text><path class="edge" d="M492 86H524" marker-end="url(#landing-arrow)"/><text class="elabel" x="169" y="26" text-anchor="middle">an approver or code owner</text><text class="elabel" x="369" y="26" text-anchor="middle">checks green, no agent turn</text><path class="edge" d="M424 132V166H84V134" marker-end="url(#landing-arrow)"/><text class="elabel" x="254" y="188" text-anchor="middle">disarmed, back to open: a push, changes requested,</text><text class="elabel" x="254" y="206" text-anchor="middle">a dismissed approval or a new agent turn</text></svg>
