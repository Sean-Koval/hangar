<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 166" role="img" aria-label="How a PR lands">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="how-a-pr-lands-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="166"/><rect class="box" x="20" y="40" width="128" height="56" rx="3"/><text class="name-s" x="38" y="66">Opened</text><text class="body" x="38" y="88">draft from hangar</text><rect class="box" x="184" y="40" width="128" height="56" rx="3"/><text class="name-s" x="202" y="66">Open</text><text class="body" x="202" y="88">review packet</text><path class="edge" d="M148 68H182" marker-end="url(#how-a-pr-lands-arrow)"/><rect class="box" x="348" y="40" width="128" height="56" rx="3"/><text class="name-s" x="366" y="66">Approved</text><text class="body" x="366" y="88">head approved</text><path class="edge" d="M312 68H346" marker-end="url(#how-a-pr-lands-arrow)"/><rect class="box-hub" x="512" y="40" width="128" height="56" rx="3"/><text class="name-s" x="530" y="66">Armed</text><text class="body" x="530" y="88">auto-merge armed</text><path class="edge" d="M476 68H510" marker-end="url(#how-a-pr-lands-arrow)"/><rect class="box-ext" x="676" y="40" width="128" height="56" rx="3"/><text class="name-s" x="694" y="66">Merged</text><text class="body" x="694" y="88">rules met</text><path class="edge" d="M640 68H674" marker-end="url(#how-a-pr-lands-arrow)"/><text class="elabel" x="266" y="30" text-anchor="middle">an approver or code owner</text><text class="elabel" x="430" y="30" text-anchor="middle">checks green, no agent turn</text><path class="edge" d="M628 96V150H196V98" marker-end="url(#how-a-pr-lands-arrow)"/><text class="elabel" x="412" y="144" text-anchor="middle">disarmed, back to open: a push, changes requested, a new agent turn</text></svg>
