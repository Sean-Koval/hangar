<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 620" role="img" aria-label="Running hangar: deploy, prove, run, upgrade">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="operate-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="620"/><rect class="box" x="20" y="16" width="268" height="126" rx="12"/><text class="lbl" x="36" y="44">Once</text><text class="name-s" x="36" y="66">Deploy</text><text class="body" x="36" y="88">GKE, or your</text><text class="body" x="36" y="106">company's cluster,</text><text class="body" x="36" y="124">from CI/CD</text><path class="edge" d="M60 142V168" marker-end="url(#operate-stacked-arrow)"/><rect class="box-hub" x="20" y="170" width="268" height="126" rx="12"/><clipPath id="operate-stacked-pe20-170-268-126"><rect x="20" y="170" width="268" height="126" rx="12"/></clipPath><rect x="20" y="170" width="268" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#operate-stacked-pe20-170-268-126)"/><text class="lbl" x="36" y="198">Every deploy</text><text class="name-s" x="36" y="220">Prove</text><text class="body" x="36" y="242">Acceptance checks</text><text class="body" x="36" y="260">on the cluster;</text><text class="body" x="36" y="278">hangar doctor</text><path class="edge" d="M60 296V322" marker-end="url(#operate-stacked-arrow)"/><rect class="box" x="20" y="324" width="268" height="126" rx="12"/><text class="lbl" x="36" y="352">Day to day</text><text class="name-s" x="36" y="374">Run</text><text class="body" x="36" y="396">SLOs and alerts,</text><text class="body" x="36" y="414">runbooks, backups</text><text class="body" x="36" y="432">and drills</text><path class="edge" d="M60 450V476" marker-end="url(#operate-stacked-arrow)"/><rect class="box-ext" x="20" y="478" width="268" height="126" rx="12"/><text class="lbl" x="36" y="506">Each release</text><text class="name-s" x="36" y="528">Upgrade</text><text class="body" x="36" y="550">Back up, prebuild,</text><text class="body" x="36" y="568">deploy; roll back</text><text class="body" x="36" y="586">if a check fails</text><path class="edge" d="M288 541H306V233H290" marker-end="url(#operate-stacked-arrow)"/><text class="elabel" x="330" y="387" text-anchor="middle" transform="rotate(-90 330 387)">every upgrade is proved again</text></svg>
