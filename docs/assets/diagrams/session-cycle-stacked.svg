<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 620" role="img" aria-label="A session: turn, checkpoint, suspend, resume">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="session-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="620"/><rect class="box" x="20" y="16" width="268" height="126" rx="12"/><text class="lbl" x="36" y="44">You send</text><text class="name-s" x="36" y="66">A turn</text><text class="body" x="36" y="88">The agent works</text><text class="body" x="36" y="106">in a sandbox, on</text><text class="body" x="36" y="124">the session branch</text><path class="edge" d="M60 142V168" marker-end="url(#session-stacked-arrow)"/><rect class="box-hub" x="20" y="170" width="268" height="126" rx="12"/><clipPath id="session-stacked-pe20-170-268-126"><rect x="20" y="170" width="268" height="126" rx="12"/></clipPath><rect x="20" y="170" width="268" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#session-stacked-pe20-170-268-126)"/><text class="lbl" x="36" y="198">After every turn</text><text class="name-s" x="36" y="220">Checkpoint</text><text class="body" x="36" y="242">The conversation,</text><text class="body" x="36" y="260">commits and</text><text class="body" x="36" y="278">uncommitted files</text><path class="edge" d="M60 296V322" marker-end="url(#session-stacked-arrow)"/><rect class="box" x="20" y="324" width="268" height="126" rx="12"/><text class="lbl" x="36" y="352">Idle</text><text class="name-s" x="36" y="374">Suspend</text><text class="body" x="36" y="396">The sandbox is</text><text class="body" x="36" y="414">released; only</text><text class="body" x="36" y="432">storage is kept</text><path class="edge" d="M60 450V476" marker-end="url(#session-stacked-arrow)"/><rect class="box-ext" x="20" y="478" width="268" height="126" rx="12"/><text class="lbl" x="36" y="506">You send again</text><text class="name-s" x="36" y="528">Resume</text><text class="body" x="36" y="550">A fresh sandbox,</text><text class="body" x="36" y="568">restored from</text><text class="body" x="36" y="586">the checkpoint</text><path class="edge" d="M288 541H306V233H290" marker-end="url(#session-stacked-arrow)"/><text class="elabel" x="330" y="387" text-anchor="middle" transform="rotate(-90 330 387)">its next turn is checkpointed too</text></svg>
