<defs><marker id="slack-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="480"/><rect class="person" x="20" y="20" width="270" height="64" rx="3"/><text class="name-s" x="38" y="46">/hangar &lt;instructions&gt;</text><text class="body" x="38" y="68">in a channel</text><path class="edge" d="M155 84V116" marker-end="url(#slack-stacked-arrow)"/><rect class="box-hub" x="20" y="118" width="270" height="82" rx="3"/><text class="name-s" x="38" y="144">hangar posts</text><text class="body" x="38" y="166">“@you asked hangar to</text><text class="body" x="38" y="184">work on owner/repo”</text><path class="edge" d="M155 200V232" marker-end="url(#slack-stacked-arrow)"/><rect class="box-ext" x="20" y="234" width="270" height="118" rx="3"/><text class="name-s" x="38" y="260">The thread</text><text class="body" x="38" y="282">Queued as job-3fa2c1d0</text><text class="body" x="38" y="300">Agent started</text><text class="body" x="38" y="318">Done: PR, verification,</text><text class="body" x="38" y="336">summary</text><path class="edge-plan" d="M155 352V394" marker-end="url(#slack-stacked-arrow)"/><text class="elabel" x="165" y="378" text-anchor="start">a reply in the thread</text><rect class="box" x="20" y="396" width="270" height="64" rx="3"/><text class="name-s" x="38" y="422">Follow-up turn</text><text class="body" x="38" y="444">same branch and PR</text><path class="edge" d="M290 428H324V332H292" marker-end="url(#slack-stacked-arrow)"/><text class="elabel" x="340" y="380" text-anchor="middle" transform="rotate(-90 340 380)">Done, again in the thread</text></svg>
