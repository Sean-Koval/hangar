<defs><marker id="start-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="620"/><rect class="box" x="20" y="16" width="310" height="126" rx="12"/><text class="lbl" x="36" y="44">Step 1</text><text class="name-s" x="36" y="66">The words</text><text class="body" x="36" y="88">Environment,</text><text class="body" x="36" y="106">harness, sandbox,</text><text class="body" x="36" y="124">session and job</text><path class="edge" d="M60 142V168" marker-end="url(#start-stacked-arrow)"/><rect class="box-hub" x="20" y="170" width="310" height="126" rx="12"/><clipPath id="start-stacked-pe20-170-310-126"><rect x="20" y="170" width="310" height="126" rx="12"/></clipPath><rect x="20" y="170" width="310" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#start-stacked-pe20-170-310-126)"/><text class="lbl" x="36" y="198">Step 2</text><text class="name-s" x="36" y="220">hangar up</text><text class="body" x="36" y="242">Docker and uv on</text><text class="body" x="36" y="260">a laptop, about</text><text class="body" x="36" y="278">five minutes</text><path class="edge" d="M60 296V322" marker-end="url(#start-stacked-arrow)"/><rect class="box" x="20" y="324" width="310" height="126" rx="12"/><text class="lbl" x="36" y="352">Step 3</text><text class="name-s" x="36" y="374">First task</text><text class="body" x="36" y="396">A sandbox, an API</text><text class="body" x="36" y="414">key and a prompt</text><text class="body" x="36" y="432">from your client</text><path class="edge" d="M60 450V476" marker-end="url(#start-stacked-arrow)"/><rect class="box-ext" x="20" y="478" width="310" height="126" rx="12"/><text class="lbl" x="36" y="506">Step 4</text><text class="name-s" x="36" y="528">The console</text><text class="body" x="36" y="550">Watch the agent</text><text class="body" x="36" y="568">work, on</text><text class="body" x="36" y="586">localhost:8787</text></svg>
