<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 620" role="img" aria-label="The first steps: the words, hangar up, a first task, the console">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
