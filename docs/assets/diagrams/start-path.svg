<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 158" role="img" aria-label="The first steps: the words, hangar up, a first task, the console">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="start-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="680" height="158"/><rect class="box" x="16" y="16" width="148" height="126" rx="12"/><text class="lbl" x="32" y="44">Step 1</text><text class="name-s" x="32" y="66">The words</text><text class="body" x="32" y="88">Environment,</text><text class="body" x="32" y="106">harness, sandbox,</text><text class="body" x="32" y="124">session and job</text><rect class="box-hub" x="182" y="16" width="148" height="126" rx="12"/><clipPath id="start-pe182-16-148-126"><rect x="182" y="16" width="148" height="126" rx="12"/></clipPath><rect x="182" y="16" width="148" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#start-pe182-16-148-126)"/><text class="lbl" x="198" y="44">Step 2</text><text class="name-s" x="198" y="66">hangar up</text><text class="body" x="198" y="88">Docker and uv on</text><text class="body" x="198" y="106">a laptop, about</text><text class="body" x="198" y="124">five minutes</text><path class="edge" d="M164 79H180" marker-end="url(#start-arrow)"/><rect class="box" x="348" y="16" width="148" height="126" rx="12"/><text class="lbl" x="364" y="44">Step 3</text><text class="name-s" x="364" y="66">First task</text><text class="body" x="364" y="88">A sandbox, an API</text><text class="body" x="364" y="106">key and a prompt</text><text class="body" x="364" y="124">from your client</text><path class="edge" d="M330 79H346" marker-end="url(#start-arrow)"/><rect class="box-ext" x="514" y="16" width="148" height="126" rx="12"/><text class="lbl" x="530" y="44">Step 4</text><text class="name-s" x="530" y="66">The console</text><text class="body" x="530" y="88">Watch the agent</text><text class="body" x="530" y="106">work, on</text><text class="body" x="530" y="124">localhost:8787</text><path class="edge" d="M496 79H512" marker-end="url(#start-arrow)"/></svg>
