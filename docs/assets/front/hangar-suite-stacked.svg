<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 1008" role="img" aria-label="Where hangar sits">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="suite-stacked-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="350" height="1008"/><text class="title" x="20" y="40" text-anchor="start">Where hangar sits</text><text class="lbl" x="20" y="64" text-anchor="start">Many doors · one run plane · one gate</text><rect class="box" x="20" y="88" width="310" height="108" rx="12"/><text class="lbl" x="36" y="116">Work in</text><text class="name-s" x="36" y="138">Doors</text><text class="body" x="36" y="160">Jira, GitHub, Slack, MCP,</text><text class="body" x="36" y="178">webhooks, schedules, A2A</text><path class="edge" d="M60 196V222" marker-end="url(#suite-stacked-arrow)"/><rect class="box-hub" x="20" y="224" width="310" height="108" rx="12"/><clipPath id="suite-stacked-pe20-224-310-108"><rect x="20" y="224" width="310" height="108" rx="12"/></clipPath><rect x="20" y="224" width="310" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#suite-stacked-pe20-224-310-108)"/><text class="lbl" x="36" y="252">Run</text><text class="name-s" x="36" y="274">hangar runs it</text><text class="body" x="36" y="296">A sandbox per job, the repo's own</text><text class="body" x="36" y="314">check, credentials outside</text><path class="edge" d="M60 332V358" marker-end="url(#suite-stacked-arrow)"/><rect class="box-ext" x="20" y="360" width="310" height="108" rx="12"/><text class="lbl" x="36" y="388">The gate</text><text class="name-s" x="36" y="410">Draft PR</text><text class="body" x="36" y="432">One commit, pushed by hangar;</text><text class="body" x="36" y="450">an approval lands it</text><path class="edge" d="M60 468V494" marker-end="url(#suite-stacked-arrow)"/><rect class="person" x="20" y="496" width="310" height="108" rx="12"/><text class="lbl" x="36" y="524">Your team</text><text class="name-s" x="36" y="546">People</text><text class="body" x="36" y="568">Review, answer and approve: the</text><text class="body" x="36" y="586">console, Slack, the CLI, MCP</text><text class="lbl" x="20" y="638" text-anchor="start">Around it</text><rect class="box" x="20" y="654" width="310" height="108" rx="12"/><clipPath id="suite-stacked-pe20-654-310-108"><rect x="20" y="654" width="310" height="108" rx="12"/></clipPath><rect x="20" y="654" width="310" height="3" fill="var(--af-fg-subtle, #8A8A8A)" clip-path="url(#suite-stacked-pe20-654-310-108)"/><text class="lbl" x="36" y="682">Team harness repo</text><text class="name-s" x="36" y="704">Define</text><text class="body" x="36" y="726">The harness lock, from a good run;</text><text class="body" x="36" y="744">ai-dlc adds a workflow plugin</text><rect class="box" x="20" y="776" width="310" height="90" rx="12"/><clipPath id="suite-stacked-pe20-776-310-90"><rect x="20" y="776" width="310" height="90" rx="12"/></clipPath><rect x="20" y="776" width="310" height="3" fill="var(--af-product-flightdeck, #D98CD2)" clip-path="url(#suite-stacked-pe20-776-310-90)"/><text class="lbl" x="36" y="804">flightdeck</text><text class="name-s" x="36" y="826">Judge</text><text class="body" x="36" y="848">Reads every run from the outbox</text><rect class="box-plan" x="20" y="880" width="310" height="108" rx="12"/><clipPath id="suite-stacked-pe20-880-310-108"><rect x="20" y="880" width="310" height="108" rx="12"/></clipPath><rect x="20" y="880" width="310" height="3" fill="var(--af-product-tower, #67B0F9)" clip-path="url(#suite-stacked-pe20-880-310-108)"/><text class="lbl" x="36" y="908">Tower</text><text class="name-s" x="36" y="930">Govern</text><text class="body" x="36" y="952">Decides risky actions; hangar's</text><text class="body" x="36" y="970">wiring to it is next (dashed)</text></svg>
