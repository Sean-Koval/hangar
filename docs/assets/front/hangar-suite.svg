<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-label="Where hangar sits">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="where-hangar-sits-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="396"/><pattern id="where-hangar-sits-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="560" y="16" width="220" height="60" fill="url(#where-hangar-sits-dots)"/><text class="title" x="20" y="44" text-anchor="start">Where hangar sits</text><text class="lbl" x="20" y="66" text-anchor="start">MANY DOORS  ·  ONE RUN PLANE  ·  ONE GATE</text><rect class="box" x="20" y="92" width="175" height="118" rx="3"/><text class="lbl" x="38" y="118">WORK IN</text><text class="name-s" x="38" y="140">Doors</text><text class="body" x="38" y="162">Trackers, chat, automation:</text><text class="body" x="38" y="180">Jira, GitHub, Slack, MCP,</text><text class="body" x="38" y="198">webhooks, schedules, A2A</text><rect class="box-hub" x="215" y="92" width="175" height="118" rx="3"/><rect x="215" y="92" width="175" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="233" y="118">RUN PLANE</text><text class="name-s" x="233" y="140">hangar runs it</text><text class="body" x="233" y="162">An isolated sandbox per job</text><text class="body" x="233" y="180">The repo's own check</text><text class="body" x="233" y="198">Credentials stay outside</text><rect class="box-ext" x="410" y="92" width="175" height="118" rx="3"/><text class="lbl" x="428" y="118">THE GATE</text><text class="name-s" x="428" y="140">Draft PR</text><text class="body" x="428" y="162">One commit, pushed by</text><text class="body" x="428" y="180">hangar; an approval</text><text class="body" x="428" y="198">lands it</text><rect class="person" x="605" y="92" width="175" height="118" rx="3"/><text class="lbl" x="623" y="118">YOUR TEAM</text><text class="name-s" x="623" y="140">People</text><text class="body" x="623" y="162">Review, answer, approve:</text><text class="body" x="623" y="180">console, Slack, CLI, MCP</text><path class="edge" d="M195 151H213" marker-end="url(#where-hangar-sits-arrow)"/><path class="edge" d="M390 151H408" marker-end="url(#where-hangar-sits-arrow)"/><path class="edge" d="M585 151H603" marker-end="url(#where-hangar-sits-arrow)"/><rect class="box" x="20" y="262" width="240" height="86" rx="3"/><rect x="20" y="262" width="240" height="2" fill="var(--af-product-aidlc, #69C27E)"/><text class="lbl" x="38" y="288">TEAM HARNESS REPO + AI-DLC</text><text class="name-s" x="38" y="310">Define</text><text class="body" x="38" y="332">Harness lock, frozen from a good run</text><rect class="box" x="280" y="262" width="240" height="86" rx="3"/><rect x="280" y="262" width="240" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="298" y="288">FLIGHTDECK</text><text class="name-s" x="298" y="310">Judge</text><text class="body" x="298" y="332">Reads every run from the outbox</text><rect class="box-plan" x="540" y="262" width="240" height="86" rx="3"/><rect x="540" y="262" width="240" height="2" fill="var(--af-product-tower, #C5A93B)"/><text class="lbl" x="558" y="288">TOWER</text><text class="name-s" x="558" y="310">Govern</text><text class="body" x="558" y="332">Decides risky actions (#172, planned)</text><path class="edge" d="M140 260V236H250V212" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="148" y="252" text-anchor="start">harness lock</text><path class="edge" d="M340 212V260" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="348" y="246" text-anchor="start">outbox</text><path class="edge-plan" d="M430 212V236H660V260" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="545" y="230" text-anchor="middle">decide?</text><text class="elabel" x="20" y="376" text-anchor="start">Solid: shipped. Dashed: Tower's decision API is built; hangar's wiring to it is open.</text></svg>
