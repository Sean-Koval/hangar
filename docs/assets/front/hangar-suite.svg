<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Where hangar sits">
<style>
  .af-d .bg { fill: var(--af-canvas, #000000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .name { font: 700 16px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .name-s { font: 700 14px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #FFFFFF); }
  .af-d .body { font: 400 13px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="suite-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="800" height="460"/><pattern id="suite-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="560" y="16" width="220" height="64" fill="url(#suite-dots)"/><text class="title" x="20" y="44" text-anchor="start">Where hangar sits</text><text class="lbl" x="20" y="70" text-anchor="start">Many doors  ·  one run plane  ·  one gate</text><rect class="box" x="20" y="104" width="172" height="124" rx="12"/><text class="lbl" x="36" y="132">Work in</text><text class="name-s" x="36" y="154">Doors</text><text class="body" x="36" y="176">Jira, GitHub, Slack,</text><text class="body" x="36" y="194">MCP, webhooks,</text><text class="body" x="36" y="212">schedules, A2A</text><rect class="box-hub" x="216" y="104" width="172" height="124" rx="12"/><clipPath id="suite-pe216-104-172-124"><rect x="216" y="104" width="172" height="124" rx="12"/></clipPath><rect x="216" y="104" width="172" height="3" fill="var(--af-product-hangar, #24C1C9)" clip-path="url(#suite-pe216-104-172-124)"/><text class="lbl" x="232" y="132">Run</text><text class="name-s" x="232" y="154">hangar runs it</text><text class="body" x="232" y="176">A sandbox per job</text><text class="body" x="232" y="194">The repo's own check</text><text class="body" x="232" y="212">Credentials outside</text><rect class="box-ext" x="412" y="104" width="172" height="124" rx="12"/><text class="lbl" x="428" y="132">The gate</text><text class="name-s" x="428" y="154">Draft PR</text><text class="body" x="428" y="176">One commit, pushed</text><text class="body" x="428" y="194">by hangar; an</text><text class="body" x="428" y="212">approval lands it</text><rect class="person" x="608" y="104" width="172" height="124" rx="12"/><text class="lbl" x="624" y="132">Your team</text><text class="name-s" x="624" y="154">People</text><text class="body" x="624" y="176">Review, answer and</text><text class="body" x="624" y="194">approve: console,</text><text class="body" x="624" y="212">Slack, CLI, MCP</text><path class="edge" d="M192 166H214" marker-end="url(#suite-arrow)"/><path class="edge" d="M388 166H410" marker-end="url(#suite-arrow)"/><path class="edge" d="M584 166H606" marker-end="url(#suite-arrow)"/><rect class="box" x="20" y="300" width="240" height="106" rx="12"/><clipPath id="suite-pe20-300-240-106"><rect x="20" y="300" width="240" height="106" rx="12"/></clipPath><rect x="20" y="300" width="240" height="3" fill="var(--af-fg-subtle, #8A8A8A)" clip-path="url(#suite-pe20-300-240-106)"/><text class="lbl" x="36" y="328">Team harness repo</text><text class="name-s" x="36" y="350">Define</text><text class="body" x="36" y="372">The harness lock, from a good</text><text class="body" x="36" y="390">run; ai-dlc adds a plugin</text><rect class="box" x="280" y="300" width="240" height="106" rx="12"/><clipPath id="suite-pe280-300-240-106"><rect x="280" y="300" width="240" height="106" rx="12"/></clipPath><rect x="280" y="300" width="240" height="3" fill="var(--af-product-flightdeck, #D98CD2)" clip-path="url(#suite-pe280-300-240-106)"/><text class="lbl" x="296" y="328">flightdeck</text><text class="name-s" x="296" y="350">Judge</text><text class="body" x="296" y="372">Reads every run from</text><text class="body" x="296" y="390">the outbox</text><rect class="box-plan" x="540" y="300" width="240" height="106" rx="12"/><clipPath id="suite-pe540-300-240-106"><rect x="540" y="300" width="240" height="106" rx="12"/></clipPath><rect x="540" y="300" width="240" height="3" fill="var(--af-product-tower, #67B0F9)" clip-path="url(#suite-pe540-300-240-106)"/><text class="lbl" x="556" y="328">Tower</text><text class="name-s" x="556" y="350">Govern</text><text class="body" x="556" y="372">Decides risky actions;</text><text class="body" x="556" y="390">hangar's wiring is next</text><path class="edge" d="M140 300V266H256V230" marker-end="url(#suite-arrow)"/><text class="elabel" x="150" y="258" text-anchor="start">harness lock</text><path class="edge" d="M336 228V298" marker-end="url(#suite-arrow)"/><text class="elabel" x="346" y="284" text-anchor="start">outbox</text><path class="edge-plan" d="M472 228V266H660V298" marker-end="url(#suite-arrow)"/><text class="elabel" x="668" y="286" text-anchor="start">decide?</text><text class="elabel" x="20" y="440" text-anchor="start">Solid: shipped. Dashed: Tower's decision API is built; hangar's wiring to it is open.</text></svg>
