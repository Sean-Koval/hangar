<svg class="af-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="Where hangar sits">
<style>
  .af-d .bg { fill: var(--af-canvas, #000); }
  .af-d .box { fill: var(--af-raised, #141414); }
  .af-d .box-hub { fill: var(--af-raised, #141414); stroke: var(--af-brand-line, #FFC400); stroke-width: 1.5; }
  .af-d .box-plan { fill: none; stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; stroke-dasharray: 4 4; }
  .af-d .box-ext { fill: var(--af-surface, #0A0A0A); stroke: var(--af-line-strong, #6B6B6B); stroke-width: 1; }
  .af-d .person { fill: var(--af-surface, #0A0A0A); stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1; }
  .af-d .bound { fill: none; stroke: var(--af-rule, #3A3A3A); stroke-width: 1; stroke-dasharray: 2 5; }
  .af-d .name { font: 700 15px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .name-s { font: 700 13px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .title { font: 700 20px "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; fill: var(--af-fg, #fff); }
  .af-d .body { font: 400 12.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-muted, #A6A6A6); }
  .af-d .lbl { font: 500 10.5px "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .edge { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; }
  .af-d .edge-plan { fill: none; stroke: var(--af-fg-subtle, #8A8A8A); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .af-d .elabel { font: 400 11.5px "Red Hat Text", "Helvetica Neue", Arial, sans-serif; fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .arrowhead { fill: var(--af-fg-subtle, #8A8A8A); }
  .af-d .dot { fill: var(--af-dot-field, #262626); }
</style>
<defs><marker id="where-hangar-sits-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1200" height="590"/><pattern id="where-hangar-sits-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle class="dot" cx="4" cy="4" r="1.1"/></pattern><rect x="900" y="20" width="300" height="70" fill="url(#where-hangar-sits-dots)"/><text class="title" x="40" y="48" text-anchor="start">Where hangar sits</text><text class="lbl" x="40" y="72" text-anchor="start">MANY DOORS  ·  ONE RUN PLANE  ·  ONE GATE</text><rect class="box" x="40" y="110" width="250" height="76" rx="3"/><text class="name-s" x="58" y="136">Trackers</text><text class="body" x="58" y="158">Jira “Ready for agent”, GitHub</text><text class="body" x="58" y="176">labels and Projects columns</text><rect class="box" x="40" y="202" width="250" height="76" rx="3"/><text class="name-s" x="58" y="228">Chat and laptops</text><text class="body" x="58" y="250">Slack @hangar; Claude Code, Codex</text><text class="body" x="58" y="268">or Cursor over MCP</text><rect class="box" x="40" y="294" width="250" height="76" rx="3"/><text class="name-s" x="58" y="320">Automation</text><text class="body" x="58" y="342">Schedules, webhooks, CI,</text><text class="body" x="58" y="360">A2A and the REST API</text><rect class="box-hub" x="390" y="110" width="400" height="250" rx="3"/><rect x="390" y="110" width="400" height="2" fill="var(--af-product-hangar, #EE8F63)"/><text class="lbl" x="408" y="136">HANGAR  ·  RUN PLANE</text><text class="name" x="408" y="158">Run the work</text><text class="body" x="408" y="180">Admission: repo policy, trust, budgets, fairness</text><text class="body" x="408" y="198">Jobs (one-shot) and sessions (resumable)</text><text class="body" x="408" y="216">Isolated sandboxes from prepared environments:</text><text class="body" x="408" y="234">  Docker, gVisor or Kata VM, GKE, E2B</text><text class="body" x="408" y="252">Claude Code, Codex, pi or Antigravity inside</text><text class="body" x="408" y="270">Verify with the repo's own check</text><text class="body" x="408" y="288">Push through the git gateway; credentials stay out</text><text class="body" x="408" y="306">The inbox: reviews, questions, approvals</text><rect class="box-ext" x="930" y="110" width="230" height="120" rx="3"/><text class="lbl" x="948" y="136">GITHUB</text><text class="name-s" x="948" y="158">One gate: the PR</text><text class="body" x="948" y="180">Draft PR with a review packet;</text><text class="body" x="948" y="198">an approval lands it</text><text class="body" x="948" y="216">(landing, merge stays human)</text><rect class="person" x="930" y="250" width="230" height="120" rx="3"/><text class="lbl" x="948" y="276">YOUR TEAM</text><text class="name-s" x="948" y="298">People</text><text class="body" x="948" y="320">Review PRs, answer questions,</text><text class="body" x="948" y="338">steer a running agent</text><text class="body" x="948" y="356">(web UI, Slack, CLI, MCP)</text><rect class="box" x="40" y="440" width="350" height="112" rx="3"/><rect x="40" y="440" width="350" height="2" fill="var(--af-product-aidlc, #69C27E)"/><text class="lbl" x="58" y="466">AI-DLC  +  HARNESS REPO</text><text class="name-s" x="58" y="488">Define</text><text class="body" x="58" y="510">Team workflow plugin and harness lock;</text><text class="body" x="58" y="528">hangar thaws a lock into a sandbox</text><rect class="box" x="425" y="440" width="350" height="112" rx="3"/><rect x="425" y="440" width="350" height="2" fill="var(--af-product-flightdeck, #D98CD2)"/><text class="lbl" x="443" y="466">FLIGHTDECK</text><text class="name-s" x="443" y="488">Judge</text><text class="body" x="443" y="510">Reads runs from the outbox: manifests,</text><text class="body" x="443" y="528">traces (hangar.trace/v1), grades</text><rect class="box-plan" x="810" y="440" width="350" height="112" rx="3"/><rect x="810" y="440" width="350" height="2" fill="var(--af-product-tower, #C5A93B)"/><text class="lbl" x="828" y="466">TOWER  ·  PLANNED</text><text class="name-s" x="828" y="488">Govern</text><text class="body" x="828" y="510">Approvals and rules for risky actions;</text><text class="body" x="828" y="528">hangar asks, Tower decides</text><path class="edge" d="M290 148H360V200H388" marker-end="url(#where-hangar-sits-arrow)"/><path class="edge" d="M290 240H388" marker-end="url(#where-hangar-sits-arrow)"/><path class="edge" d="M290 332H360V280H388" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="298" y="232" text-anchor="start">tickets, tasks</text><path class="edge" d="M790 170H928" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="802" y="162" text-anchor="start">branch + draft PR</text><path class="edge" d="M790 290H928" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="802" y="282" text-anchor="start">inbox, comments</text><path class="edge" d="M930 340H792" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="802" y="332" text-anchor="start">replies, approvals</text><path class="edge" d="M215 438V400H500V362" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="223" y="418" text-anchor="start">harness lock</text><path class="edge" d="M590 360V438" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="598" y="410" text-anchor="start">outbox</text><path class="edge-plan" d="M720 360V400H985V438" marker-end="url(#where-hangar-sits-arrow)"/><text class="elabel" x="870" y="392" text-anchor="middle">decide?</text></svg>
