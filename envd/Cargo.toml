[package]
name = "hangar-envd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "In-sandbox daemon for hangar: process, PTY, filesystem and file transfer over Connect RPC (E2B envd protocol)"
publish = false

[[bin]]
name = "hangar-envd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "multipart"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
bytes = "1"
connectrpc = { version = "0.9", default-features = false, features = ["axum", "json", "gzip"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "term", "user", "ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[build-dependencies]
connectrpc-build = "0.9"
protox = "0.10"
prost = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
