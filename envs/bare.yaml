# The default starting point: Ubuntu + git tooling, no language runtimes, no harness binaries.
# Every agent harness is *allowed*; each sandbox gets the one you pick (create_sandbox harness=...),
# mounted read-only as a harness pack, with only that harness's credentials and config applied.
# Egress: no mode here, so sandboxes follow HANGAR_EGRESS_DEFAULT: `allowlist` on GKE, `open` on a laptop. Under
# allowlist they reach their harness's model API, PyPI, npm and Go through hangar's read-only mirror, crates, and the
# repo through the git gateway. A child that needs more adds `egress: {allow: [host]}`; one that needs the open
# internet says `egress: {mode: open}` and why (docs/security/egress-default.md).
name: bare
description: Ubuntu 24.04 + git/gh/tmux/ripgrep; any agent (Claude Code, Codex, pi, Antigravity)
base: mirror.gcr.io/library/ubuntu:24.04  # Google's Docker Hub mirror: same image, no pull rate limits
tools:
  apt: [gh, fd-find, shellcheck]
harnesses: [claude-code, codex, pi, antigravity]  # allowed agents; a child env's list replaces this one
default_harness: claude-code
# Every harness runs its provider's everyday line (`balanced`: Opus on Claude Code), resolved to a concrete id from the
# provider's live model list when a sandbox or session is created, and pinned for it (docs/harnesses.md, "Models").
# Override per run with run_agent(model=...), per environment, repo policy or job with `frontier` (the strongest, at
# several times the price) or a pinned id.
model: balanced
resources:
  cpus: 2
  memory_gb: 4
agent_config:
  instructions: |
    You are working inside a disposable hangar sandbox.
    - The repo checkout is your working directory; commit to your work branch freely.
    - Run the project's tests before declaring a task done.
    - Prefer small, reviewable commits with descriptive messages.
