# Python + Node + Go in one image. Harnesses are packs, so allowing all four agents adds nothing to it:
# compare agents on the same task by creating one sandbox per harness from this environment.
name: polyglot
description: bare + Python 3.12/uv, Node 22, Go 1.24
extends: bare
tools:
  mise:
    python: "3.12"
    uv: latest
    node: "22"
    go: "1.24"
dependencies:
  pip: [ruff, pytest]
  npm: [pnpm, typescript]
skills:
  - path: skills/repo-conventions
resources:
  cpus: 4
  memory_gb: 8
