      - Concepts: concepts.md
      - Getting started: guide.md
      - Connecting clients: clients.md
      - Using MCP: mcp.md
      - Team setup: team.md
      - Onboarding a team (runbook): runbooks/onboarding.md
      - The Friday harness review (runbook): runbooks/harness-review.md
  - Guides:
      - Work:
