site_name: hangar
site_description: A control plane for isolated, cloneable coding-agent sandboxes.
site_url: https://sean-koval.github.io/hangar/
repo_url: https://github.com/Sean-Koval/hangar
repo_name: Sean-Koval/hangar
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides   # overrides/main.html adds the Airframe suite strip (vendored partial)
  font: false
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark

extra_css:
  - stylesheets/airframe.css
  - stylesheets/airframe-docs.css
  - stylesheets/product.css

extra:
  airframe:
    product: hangar   # the current item in the suite strip

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs/assets/diagrams, docs/assets/front]   # the theme-aware SVGs diagram.py draws, inlined with --8<--
      check_paths: true

# Not pages: benchmark scripts kept next to a research note, and the repo's notes on the brand and front-page assets.
exclude_docs: |
  research/0012/
  assets/README.md

# The site's map, in the order a newcomer reads it: start here (the words, the quickstart, the console), the guides by
# task, the reference (the APIs first), design notes, operations. Every page under docs/ is in it except what
# exclude_docs lists and the superseded and deferred specs (0001, 0004, 0005, 0007, 0008): a design record that no
# longer describes hangar would mislead from the nav, so they keep their pages and are reached from specs/README.md
# only. The built specs stay in the nav: they are the reasoning behind what runs today.
# tests/test_editorial.py checks every page in this map exists, and holds each page to the editorial rule: 700 words of
# prose, 60 to a paragraph, 25 to a sentence (a page written before the rule keeps under its listed ceilings).
