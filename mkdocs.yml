          - 0014 Sister tool interfaces: specs/0014-sister-tool-interfaces.md
          - 0015 Governance decision point: specs/0015-governance-decision-point.md
      - Superseded and deferred:
          - 0001 Agent runs (superseded): specs/0001-agent-runs.md
          - 0004 Supervisor, scheduling, performance (deferred): specs/0004-supervisor-scheduling-performance.md
          - 0005 Traces and decision model (deferred): specs/0005-traces-and-decision-model.md
          - 0007 Experiments, policy and team learning (deferred): specs/0007-experiments-policy-and-team-learning.md
