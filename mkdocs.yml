site_name: hangar
site_description: A control plane for isolated, cloneable coding-agent sandboxes.
site_url: https://sean-koval.github.io/hangar/
repo_url: https://github.com/Sean-Koval/hangar
repo_name: Sean-Koval/hangar
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides   # overrides/main.html adds the Airframe suite strip (vendored partial)
  font: false
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark

extra_css:
  - stylesheets/airframe.css
  - stylesheets/airframe-docs.css
  - stylesheets/product.css

copyright: Part of the <a href="https://sean-koval.github.io/agent-factory/">agent factory</a>

extra:
  airframe:
    product: hangar   # the current item in the suite strip
  social:
    - icon: material/factory
      link: https://sean-koval.github.io/agent-factory/
      name: Part of the agent factory

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets

# Benchmark scripts kept next to a research note; not pages.
exclude_docs: |
  research/0012/

# The site's map. Every page under docs/ is in it except docs/assets/README.md (notes on the brand and front-page assets, for the repo) and
# the research scripts excluded above. Superseded and deferred specs keep their pages, grouped apart (#220).
