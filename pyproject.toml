[project]
name = "hangar"
version = "0.2.0"
description = "Control plane for fleets of cloneable coding-agent sandboxes, exposed over MCP. Runs on a laptop (Docker), a single VM, or GKE (Agent Sandbox)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sean Koval" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "cryptography>=43",
    "docker>=7.1",
    "typer>=0.12",
    "httpx>=0.27",
    "websockets>=13",
    "jsonschema>=4.18",
    "prometheus-client>=0.20",  # /metrics; imported only when HANGAR_METRICS_ENABLED (docs/observability.md)
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=31"]
e2b = ["e2b>=2.50"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]  # traces when OTEL_* asks
all = ["kubernetes>=31", "e2b>=2.50", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[project.scripts]
hangar = "hangar.cli:app"

# --- plugin host (docs/plugins.md): hangar's own plugins, in the one group outside plugins use. Built-ins load
# always (each still waits for its own settings); others only when HANGAR_PLUGINS.enable names them.
[project.entry-points."hangar.plugins"]
github = "hangar.app:GITHUB_PLUGIN"
slack = "hangar.slack:PLUGIN"
jira = "hangar.jira:PLUGIN"
webhook = "hangar.events_out:PLUGIN"
command = "hangar.deliverers.command:PLUGIN"
image-ready = "hangar.deliverers.image_ready:PLUGIN"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6",
       "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30",  # observe: span tests
       "pytest-xdist>=3.8", "pytest-rerunfailures>=16"]  # CI: parallel shards; one rerun on main (docs/ci.md)

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E731", "B027"]  # FastAPI Depends defaults; small lambdas; optional provider hooks

[tool.ruff.lint.per-file-ignores]
"tests/test_kubernetes.py" = ["E402"]
"src/hangar/oauth.py" = ["E501"]  # inline HTML template
