# Harness lock: the exact agent CLI every pack (and baked image) installs. hangar reads it at import, the version is
# part of each pack's tag, and a pack build fails when the CLI it installed reports another version. So a fleet runs
# one version per harness, and a version changes only through a reviewed change to this file.
#
# Bump a harness: change its entry (and its checksums), run `tests/test_*real_clis.py` against the new CLI with
# HANGAR_TEST_<NAME> set, and say in the PR what you verified. `hangar images plan` then lists the new pack as missing
# and CI builds it before rollout.
#
# Verified 2026-10-14 against the vendors' own release sources:
# - claude-code: downloads.claude.ai/claude-code-releases/2.1.296/manifest.json (checksums below are its linux-x64 and
#   linux-arm64 entries); also on npm as @anthropic-ai/claude-code@2.1.296. 2.1.296 is what the driver's stream-json
#   control protocol, --fork-session and the cache variables were verified with. Channels that day: stable 2.1.287,
#   latest 2.1.299.
# - codex: npm @openai/codex@0.162.1 (dist-tag latest).
# - pi: npm @earendil-works/pi-coding-agent@1.1.0 (latest is 1.2.0, which the cache and fork notes also cover).
# - antigravity: the release list of agy's updater (antigravity-cli-auto-updater-....run.app/releases) names build
#   5524738307653632 for 1.3.3, the version hangar was verified with on GKE; the sha512s are of those archives in
#   gs://antigravity-public (the same method reproduces the updater's published sha512 for 1.3.5, the current one).
# - gemini (deprecated): npm @google/gemini-cli@0.64.0 (dist-tag latest).
# Canary 2026-10-17: codex 0.162.1 -> 0.163.0, pi 1.1.0 -> 1.3.0, antigravity 1.3.3 -> 1.4.0 (contract tests and the protocol diff: its PR).
