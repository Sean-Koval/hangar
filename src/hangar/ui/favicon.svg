<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Airframe hangar product mark (an outline tile with the quonset glyph in the hangar hue).
       A favicon cannot read CSS variables, so the values are Airframe theme-v2 tokens copied by hand:
       line-strong and product-hangar, Night then Day. -->
  <style>
    .tile { fill: none; stroke: #6B6B6B; stroke-width: 1.5; }
    .glyph { fill: none; stroke: #EE8F63; stroke-width: 2.1; stroke-linecap: square; stroke-linejoin: miter; }
    @media (prefers-color-scheme: light) {
      .tile { stroke: #858583; }
      .glyph { stroke: #A44C1D; }
    }
  </style>
  <rect class="tile" x="1.75" y="1.75" width="28.5" height="28.5" rx="2"/>
  <g class="glyph" transform="translate(4 4)"><path d="M3 20 V13 A9 9 0 0 1 21 13 V20"/><path d="M2 20 H22"/><path d="M9 20 V15 H15 V20"/></g>
</svg>
