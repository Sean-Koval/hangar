# REST/MCP scope parity (#122): every MCP tool and resource and every REST route, by verb, with the scope it requires
# and its owner rule. tests/test_scope_parity.py checks this against what the code enforces; keep it sorted.
#
#   server:       hangar | hangar-sandbox (after the MCP split, #140)
#   mcp:          the tool (null: none)       mcp_resource: hangar://... read paths     rest: "METHOD /path" (or a list)
#   scope:        what the caller's token needs; {mcp: ..., rest: ...} when the surfaces differ
#                   admin | user (a person's login) | jobs (service tokens) | mcp (any token /mcp accepts: admin,
#                   mcp, user, OAuth grants) | sandboxes (E2B) | metrics | approvals.can_decide (approvals.py) |
#                   signed (a webhook signature) | ticket (single-use, minted by an admin or owner) | grant (a
#                   sandbox's gateway grant or egress token) | link (a signed URL) | oauth | public
#   owner:        guard (own records unless admin: people.Guard) | token (a jobs token's own jobs) | admin | any |
#                 own_grant (OAuth: what the approving token may)
#   enforced_by:  where a route without an auth dependency checks its caller
#   exception:    why one verb's MCP and REST twins differ (required when they do)
#
# A new tool or route fails the test until it has an entry here; the failure prints a stub to paste.

.get:
  server: hangar
  mcp: null
  rest: GET /
  scope: public
  owner: any
  enforced_by: 'app: the dashboard shell; its API calls carry the token'
